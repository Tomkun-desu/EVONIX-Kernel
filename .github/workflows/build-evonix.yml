name: EVONIX Kernel Build

# Kleaf (Bazel) build of the current branch. Branch-agnostic: works identically
# on coloros/ksu-susfs and hyperos/ksu-susfs — the branch itself selects the
# EXTRAVERSION (COS vs HOS) and defconfig fragment.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      use_cache:
        description: "Restore/save Bazel cache"
        type: boolean
        default: true
      use_ds:
        description: "Droidspaces-OSS (SYSVIPC kABI fix + IPC configs)"
        type: boolean
        default: false
  push:
    branches:
      - coloros/ksu-susfs
      - hyperos/ksu-susfs
    paths-ignore:
      - "**/*.md"
      - "Documentation/**"

env:
  SRC_DIR: ${{ github.workspace }}/src
  WORK_DIR: ${{ github.workspace }}/evonix-workspace
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ksu_sha: ${{ steps.ksu-latest.outputs.ksu_sha }}
      ds_commit: ${{ steps.ds.outputs.ds_commit }}
    steps:
      - name: Checkout current branch (+ submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          submodules: recursive
          path: src

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          testing: false

      - name: Add 16 GB swap (ThinLTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Set up repo-manifest workspace (per BUILDING.md)
        run: |
          set -euo pipefail
          git config --global safe.directory '*'
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core curl rsync python3
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android15-6.6-lts --depth=1
          repo sync -c -j"$(nproc)"
          # This repo IS the common/ project: replace the manifest's common/
          # with the checked-out EVONIX source (keeps EVONIX .git history).
          rm -rf "$WORK_DIR/common"
          cp -a "$SRC_DIR" "$WORK_DIR/common"

      - name: Init KernelSU-Next submodule (latest upstream)
        id: ksu-latest
        run: |
          set -euo pipefail
          cd "$WORK_DIR/common"
          git submodule update --init --recursive
          git ls-tree HEAD KernelSU-Next
          # Unpinned: resolve the tip of pershoot/dev-susfs (same source the
          # GKI reference uses when SUSFS is on) and check it out, so every
          # build uses the latest KernelSU-Next.
          # (Same resolve-then-verify pattern as AnyKernel3 packaging below.)
          KSU_URL="https://github.com/pershoot/KernelSU-Next.git"
          KSU_TIP="$(git ls-remote "$KSU_URL" refs/heads/dev-susfs | awk '{print $1; exit}')"
          [[ "$KSU_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve KernelSU-Next tip" >&2; exit 1; }
          echo "KernelSU-Next tip: $KSU_TIP"
          echo "ksu_sha=$KSU_TIP" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            # Kbuild (kernel/Kbuild) derives version as 30000 + rev-list --count
            # of merge-base(HEAD, origin/dev) and tag via describe --tags: a
            # depth-1 detached SHA has count=1 (=> 30001) and no tags (=> empty
            # tag). Fetch branch refs + tags with full history and check out
            # the branch so abbrev-ref/merge-base/describe resolve correctly.
            git -C KernelSU-Next fetch --unshallow --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            || git -C KernelSU-Next fetch --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
          done
          git -C KernelSU-Next checkout -B dev-susfs "$KSU_TIP"
          [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_TIP" ] || { echo "KernelSU-Next pin mismatch" >&2; exit 1; }
          test -d drivers/kernelsu

      - name: Apply Droidspaces-OSS (optional, dispatch only)
        id: ds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ds }}
        run: |
          set -euo pipefail
          # Optional Droidspaces-OSS support (same source the GKI reference
          # uses when DS is on): SYSVIPC kABI fix for GKI below 6.12 + IPC
          # configs. Default OFF — push builds never take this path, and
          # evonix.config stays untouched (configs live ONLY in this step).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          DS_COMMIT="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$DS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve Droidspaces-OSS tip" >&2; exit 1; }
          echo "Droidspaces-OSS tip: $DS_COMMIT"
          echo "ds_commit=$DS_COMMIT" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$RUNNER_TEMP/Droidspaces-OSS" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/Droidspaces-OSS/.git" ] || { echo "ERROR: Droidspaces-OSS clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/Droidspaces-OSS" fetch --depth=1 origin "$DS_COMMIT"
          git -C "$RUNNER_TEMP/Droidspaces-OSS" checkout "$DS_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/Droidspaces-OSS" rev-parse HEAD)" = "$DS_COMMIT" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
          # SYSVIPC kABI fix for android15-6.6 (same patch file the GKI
          # reference applies for this version; dry-run verified on our tree).
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          # Droidspaces kernel configs, applied ephemerally here only (same 9
          # symbols as the reference actions/droidspaces Enable Kernel Configs
          # step; evonix.config itself is NOT touched). USER_NS stays off.
          DS_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          for CFG in CONFIG_PID_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_DEVTMPFS CONFIG_BINFMT_MISC CONFIG_BINFMT_SCRIPT CONFIG_BINFMT_ELF; do
            sed -i "/^# $CFG is not set$/d" "$DS_CONFIG"
            grep -qx "$CFG=y" "$DS_CONFIG" || echo "$CFG=y" >> "$DS_CONFIG"
          done
          sed -i '/^CONFIG_USER_NS=y$/d' "$DS_CONFIG"
          grep -qx '# CONFIG_USER_NS is not set' "$DS_CONFIG" || echo '# CONFIG_USER_NS is not set' >> "$DS_CONFIG"

      - name: Restore Bazel cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}
          restore-keys: |
            evonix-bazel-${{ github.ref_name }}-

      - name: Set up Clang 23 toolchain
        run: |
          set -euo pipefail
          EVONIX_WORKSPACE="$WORK_DIR" bash "$WORK_DIR/common/setup-clang23.sh"

      - name: Build via build-evonix.sh
        run: |
          set -euo pipefail
          bash "$WORK_DIR/common/build-evonix.sh" "$DIST_DIR"

      - name: Verify Image + vmlinux
        run: |
          set -euo pipefail
          test -s "$DIST_DIR/Image"
          test -s "$DIST_DIR/vmlinux"
          ls -la "$DIST_DIR"
          sha256sum "$DIST_DIR/Image" | tee "$DIST_DIR/Image.sha256"

      - name: Save Bazel cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.use_cache) }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            coloros/*) VARIANT="COS" ;;
            hyperos/*) VARIANT="HOS" ;;
            *) echo "Unknown branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac
          KVER="$(grep -m1 '^SUBLEVEL' src/Makefile | awk '{print $3}')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP_NAME="EVONIX-${VARIANT}-6.6.${KVER}-${SHORT_SHA}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          rm -rf AnyKernel3
          AK3_COMMIT="$(git ls-remote https://github.com/WildKernels/AnyKernel3.git refs/heads/gki-2.0 | awk '{print $1; exit}')"
          [ -n "$AK3_COMMIT" ] || { echo "ERROR: could not resolve AnyKernel3 gki-2.0 tip" >&2; exit 1; }
          echo "AK3_COMMIT=$AK3_COMMIT" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 AnyKernel3 && break || sleep 5; done
          [ -d AnyKernel3/.git ] || { echo "ERROR: AnyKernel3 clone failed" >&2; exit 1; }
          git -C AnyKernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C AnyKernel3 checkout "$AK3_COMMIT"
          [ "$(git -C AnyKernel3 rev-parse HEAD)" = "$AK3_COMMIT" ] || { echo "AnyKernel3 pin mismatch" >&2; exit 1; }
          rm -rf AnyKernel3/.git
          # Raw uncompressed Image only (GKI/AK3 convention: ak3-core +
          # magiskboot handle compression at repack; Image.lz4 would be wrong).
          cp -a "$DIST_DIR/Image" AnyKernel3/Image
          test -s AnyKernel3/Image
          # EVONIX branding only. Device check stays OFF (upstream default
          # do.devicecheck=0) so the zip also flashes on custom ROMs where
          # ro.product.device differs from stock 'rodin'. Slot/ramdisk/
          # vbmeta flags stay at AK3 auto defaults (A/B slots, stock
          # ramdisk, no modules).
          sed -i 's|^kernel.string=.*|kernel.string=EVONIX '"${VARIANT}"' 6.6.'"${KVER}"' by Tomkun-desu @ '"${SHORT_SHA}"'|' AnyKernel3/anykernel.sh
          grep -qx 'do.devicecheck=0' AnyKernel3/anykernel.sh || echo "WARNING: AK3 upstream default changed: do.devicecheck" >&2
          for KEY in 'do.modules=0' 'block=boot' 'is_slot_device=auto'; do
            grep -qx "$KEY" AnyKernel3/anykernel.sh || echo "WARNING: AK3 upstream default changed/missing: $KEY" >&2
          done
          rm -f "$ZIP_NAME"
          ( cd AnyKernel3 && zip -r -q -9 "../$ZIP_NAME" . )
          mkdir -p flashable && mv "$ZIP_NAME" flashable/
          ( cd flashable && sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256" )
          unzip -l "flashable/$ZIP_NAME"
          shopt -s nullglob
          ZIPS=(flashable/EVONIX-*.zip)
          [ "${#ZIPS[@]}" -eq 1 ] || { echo "ERROR: expected 1 flashable zip, found ${#ZIPS[@]}" >&2; ls -la flashable/ >&2; exit 1; }

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: evonix-flashable
          path: ${{ github.workspace }}/flashable/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Release' || inputs.release_type == 'Pre-Release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (build metadata)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download flashable zip
        uses: actions/download-artifact@v4
        with:
          name: evonix-flashable
          path: flashable

      - name: Create GitHub release (auto tag evonix-vN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          # KSU SHA comes from the build job output (submodule is unpinned at
          # build time); fallback to live tip resolve if the output is empty.
          KSU_PIN="${{ needs.build.outputs.ksu_sha }}"
          [ -n "$KSU_PIN" ] || KSU_PIN="$(git ls-remote https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs | awk '{print $1; exit}')"
          DS_PIN="${{ needs.build.outputs.ds_commit }}"
          DS_STATUS="disabled"
          if [ "${{ inputs.use_ds }}" = "true" ]; then
            [ -n "$DS_PIN" ] || DS_PIN="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
            DS_STATUS="enabled ($DS_PIN)"
          fi
          SUSFS_VER="$(grep -m1 '#define SUSFS_VERSION' include/linux/susfs.h | awk -F'"' '{print $2}')"
          KEXTRA="$(grep -m1 '^EXTRAVERSION' Makefile | awk '{print $3}')"
          mapfile -t TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^evonix-v[0-9]+$' || true)
          MAX=0
          for T in ${TAGS[@]:-}; do
            N="${T#evonix-v}"
            if [[ "$N" =~ ^[0-9]+$ && "$N" -gt "$MAX" ]]; then MAX="$N"; fi
          done
          TAG="evonix-v$((MAX + 1))"
          echo "Tag: $TAG (branch $BRANCH @ ${COMMIT:0:12})"
          cat > "BuildInfo-$TAG.md" <<EOF
          # EVONIX $TAG
          - Branch: $BRANCH
          - Commit: $COMMIT
          - Kernel: 6.6.x ($KEXTRA)
          - KernelSU-Next: $KSU_PIN (latest dev-susfs @ pershoot/KernelSU-Next)
          - SUSFS: $SUSFS_VER (in-tree)
          - Droidspaces: $DS_STATUS
          - Toolchain: Clang 23.0.1 (android build 16311247, r614150) + ThinLTO + AutoFDO
          - Device: Poco X7 Pro (rodin)
          EOF
          CREATE_ARGS=(--title "EVONIX $TAG ($BRANCH)" --notes-file "BuildInfo-$TAG.md")
          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then CREATE_ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "BuildInfo-$TAG.md"
          else
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi
          # Release ships the flashable zip + its sha256 + BuildInfo only.
          # (Raw dist/ is no longer uploaded as an artifact.)
          FILES=(BuildInfo-"$TAG".md)
          for Z in flashable/EVONIX-*; do FILES+=("$Z"); done
          N_ZIPS=0
          for F in "${FILES[@]}"; do case "$F" in flashable/EVONIX-*.zip) N_ZIPS=$((N_ZIPS+1));; esac; done
          [ "$N_ZIPS" -ge 1 ] || { echo "ERROR: no EVONIX flashable zip collected for release" >&2; ls -la flashable/ >&2; exit 1; }
          FAILED=0
          for F in "${FILES[@]}"; do
            OK=false
            for ATTEMPT in 1 2 3; do
              if gh release upload "$TAG" "$F" --clobber; then OK=true; break; fi
              echo "Attempt $ATTEMPT/3 failed for: $F" >&2
              sleep 10
            done
            [ "$OK" = true ] || FAILED=1
          done
          exit "$FAILED"
