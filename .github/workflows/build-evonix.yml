name: EVONIX Kernel Build

# Kleaf (Bazel) build of the current branch. Branch-agnostic: works identically
# on coloros/ksu-susfs and hyperos/ksu-susfs — the branch itself selects the
# EXTRAVERSION (COS vs HOS) and defconfig fragment.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      use_cache:
        description: "Restore/save Bazel cache"
        type: boolean
        default: true
      use_ds:
        description: "Droidspaces-OSS (SYSVIPC kABI fix + IPC configs)"
        type: boolean
        default: false
      use_nomount:
        description: "NoMount VFS hooks + CONFIG_NOMOUNT"
        type: boolean
        default: false
      use_ntsync:
        description: "NTSync driver (Wine/Proton sync primitives) + CONFIG_NTSYNC"
        type: boolean
        default: false
      use_bbg:
        description: "Baseband-Guard LSM + CONFIG_BBG (generic allowlist until rodin validated)"
        type: boolean
        default: false
  push:
    branches:
      - coloros/ksu-susfs
      - hyperos/ksu-susfs
    paths-ignore:
      - "**/*.md"
      - "Documentation/**"

env:
  SRC_DIR: ${{ github.workspace }}/src
  WORK_DIR: ${{ github.workspace }}/evonix-workspace
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ksu_sha: ${{ steps.ksu-latest.outputs.ksu_sha }}
      susfs_commit: ${{ steps.susfs.outputs.susfs_commit }}
      susfs_ver: ${{ steps.susfs.outputs.susfs_ver }}
      ds_commit: ${{ steps.ds.outputs.ds_commit }}
      nm_commit: ${{ steps.nm.outputs.nm_commit }}
      ntsync_commit: ${{ steps.ntsync.outputs.ntsync_commit }}
      bbg_commit: ${{ steps.bbg.outputs.bbg_commit }}
      bbg_allowlist: ${{ steps.bbg.outputs.bbg_allowlist }}
    steps:
      - name: Checkout current branch (+ submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          submodules: recursive
          path: src

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          testing: false

      - name: Add 16 GB swap (ThinLTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Set up repo-manifest workspace (per BUILDING.md)
        run: |
          set -euo pipefail
          git config --global safe.directory '*'
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core curl rsync python3
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android15-6.6-lts --depth=1
          repo sync -c -j"$(nproc)"
          # This repo IS the common/ project: replace the manifest's common/
          # with the checked-out EVONIX source (keeps EVONIX .git history).
          rm -rf "$WORK_DIR/common"
          cp -a "$SRC_DIR" "$WORK_DIR/common"

      - name: Init KernelSU-Next submodule (latest upstream)
        id: ksu-latest
        run: |
          set -euo pipefail
          cd "$WORK_DIR/common"
          git submodule update --init --recursive
          git ls-tree HEAD KernelSU-Next
          # Unpinned: resolve the tip of pershoot/dev-susfs (same source the
          # GKI reference uses when SUSFS is on) and check it out, so every
          # build uses the latest KernelSU-Next.
          # (Same resolve-then-verify pattern as AnyKernel3 packaging below.)
          KSU_URL="https://github.com/pershoot/KernelSU-Next.git"
          KSU_TIP="$(git ls-remote "$KSU_URL" refs/heads/dev-susfs | awk '{print $1; exit}')"
          [[ "$KSU_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve KernelSU-Next tip" >&2; exit 1; }
          echo "KernelSU-Next tip: $KSU_TIP"
          echo "ksu_sha=$KSU_TIP" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            # Kbuild (kernel/Kbuild) derives version as 30000 + rev-list --count
            # of merge-base(HEAD, origin/dev) and tag via describe --tags: a
            # depth-1 detached SHA has count=1 (=> 30001) and no tags (=> empty
            # tag). Fetch branch refs + tags with full history and check out
            # the branch so abbrev-ref/merge-base/describe resolve correctly.
            git -C KernelSU-Next fetch --unshallow --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            || git -C KernelSU-Next fetch --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
          done
          git -C KernelSU-Next checkout -B dev-susfs "$KSU_TIP"
          [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_TIP" ] || { echo "KernelSU-Next pin mismatch" >&2; exit 1; }
          test -d drivers/kernelsu

      - name: Apply SUSFS floating (tip of gki-android15-6.6)
        id: susfs
        run: |
          set -euo pipefail
          # Floating SUSFS (Wild-style, single-version): every build resolves
          # the tip of gki-android15-6.6 fresh and applies it onto the runner
          # copy. The git tree carries NO susfs sources and NO
          # CONFIG_KSU_SUSFS* in evonix.config (both removed in the same
          # commit that added this step); hooks come from 50_add, configs
          # merge ephemerally here. KSU (dev-susfs fork) untouched.
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_BRANCH="gki-android15-6.6"
          SUSFS_TIP="$(git ls-remote "$SUSFS_URL" "refs/heads/$SUSFS_BRANCH" | awk '{print $1; exit}')"
          [[ "$SUSFS_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve SUSFS tip" >&2; exit 1; }
          echo "SUSFS tip: $SUSFS_TIP"
          echo "susfs_commit=$SUSFS_TIP" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_URL" "$RUNNER_TEMP/susfs4ksu" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/susfs4ksu/.git" ] || { echo "ERROR: susfs4ksu clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/susfs4ksu" fetch --depth=1 origin "$SUSFS_TIP"
          git -C "$RUNNER_TEMP/susfs4ksu" checkout "$SUSFS_TIP"
          [ "$(git -C "$RUNNER_TEMP/susfs4ksu" rev-parse HEAD)" = "$SUSFS_TIP" ] || { echo "SUSFS pin mismatch" >&2; exit 1; }
          SUSFS_PATCH="50_add_susfs_in_gki-android15-6.6.patch"
          test -f "$RUNNER_TEMP/susfs4ksu/kernel_patches/$SUSFS_PATCH"
          cp "$RUNNER_TEMP/susfs4ksu/kernel_patches/fs/"* "$WORK_DIR/common/fs/"
          cp "$RUNNER_TEMP/susfs4ksu/kernel_patches/include/linux/"* "$WORK_DIR/common/include/linux/"
          cp "$RUNNER_TEMP/susfs4ksu/kernel_patches/$SUSFS_PATCH" "$WORK_DIR/common/"
          SUSFS_VER="$(grep -m1 '#define SUSFS_VERSION' "$RUNNER_TEMP/susfs4ksu/kernel_patches/include/linux/susfs.h" | awk -F'"' '{print $2}')"
          [ -n "$SUSFS_VER" ] || { echo "ERROR: SUSFS_VERSION not found" >&2; exit 1; }
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"
          # The git tree carries the hook blocks (kept); the runner copy must
          # first be stripped back to the pre-image, then the fresh 50_add is
          # applied. Strip = exact reverse of the same patch file (proved on
          # scratch: reverse + forward round-trips byte-identical, modulo the
          # vma rename below). No custom strip script — the patch is its own
          # inverse, so a newer tip with a different patch fails LOUD here
          # instead of silently mis-applying.
          # Our tree carries Google's pgsize_migration backport (newer than the
          # patch pre-image): normalize the renamed symbol before reverse,
          # same as the reference fake-patch stage (single sed, 6.12-gated
          # there, unconditional here since SUBLEVEL=142 always has it).
          if grep -q 'vma_data_pages' "$WORK_DIR/common/fs/proc/task_mmu.c"; then
            sed -i 's/vma_data_pages/vma_pages/g' "$WORK_DIR/common/fs/proc/task_mmu.c"
          fi
          git -C "$WORK_DIR/common" apply -R --check "./$SUSFS_PATCH" || exit 1
          git -C "$WORK_DIR/common" apply -R "./$SUSFS_PATCH"
          git -C "$WORK_DIR/common" apply --check "./$SUSFS_PATCH" || exit 1
          git -C "$WORK_DIR/common" apply "./$SUSFS_PATCH"
          # Restore our tree's pgsize_migration rename on the two pre-existing
          # call sites only. Guarded to the exact stock context lines so a
          # future floating patch that adds its own `if (vma_pages(vma))` is
          # never rewritten: only lines the stock tree already has.
          sed -i 's/^\tif (vma_pages(vma))$/\tif (vma_data_pages(vma))/; s/^\tif (!vma_pages(vma))$/\tif (!vma_data_pages(vma))/' "$WORK_DIR/common/fs/proc/task_mmu.c"
          # VMA_PAD_START fallback (version-agnostic, no-op when the real
          # header already provides it — same as the reference patches stage).
          if grep -q 'VMA_PAD_START(' "$WORK_DIR/common/fs/proc/task_mmu.c" && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' "$WORK_DIR/common/fs/proc/task_mmu.c"; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' "$WORK_DIR/common/fs/proc/task_mmu.c"
          fi
          # SUSFS kernel configs merged ephemerally on the runner copy;
          # evonix.config itself is NOT touched (keeps tree LOG choice).
          SUSFS_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          for SYM in CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP; do
            sed -i "/^# ${SYM} is not set$/d; /^${SYM}=n$/d" "$SUSFS_CONFIG"
            grep -qx "${SYM}=y" "$SUSFS_CONFIG" || echo "${SYM}=y" >> "$SUSFS_CONFIG"
          done
          grep -q '^CONFIG_KSU_SUSFS=y$' "$SUSFS_CONFIG"
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' "$SUSFS_CONFIG"
          # SUSFS proof in logs: visible verification that the floating patch
          # actually landed (tip, version, files, hooks, configs).
          echo "===== SUSFS APPLIED ====="
          echo "SUSFS tip: $SUSFS_TIP"
          echo "SUSFS_VERSION: $SUSFS_VER"
          echo "----- susfs files (git status) -----"
          git -C "$WORK_DIR/common" status --porcelain | grep -i susfs || true
          echo "----- susfs sources present -----"
          ls "$WORK_DIR/common/fs/susfs.c" "$WORK_DIR/common/include/linux/susfs"*.h || true
          echo "----- susfs hook markers (fs/proc/task_mmu.c) -----"
          grep -c susfs "$WORK_DIR/common/fs/proc/task_mmu.c" || true
          echo "----- CONFIG_KSU_SUSFS in evonix.config -----"
          grep '^CONFIG_KSU_SUSFS' "$SUSFS_CONFIG" || true
          echo "===== END SUSFS APPLIED ====="

      - name: Apply Droidspaces-OSS (optional, dispatch only)
        id: ds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ds }}
        run: |
          set -euo pipefail
          # Optional Droidspaces-OSS support (same source the GKI reference
          # uses when DS is on): SYSVIPC kABI fix for GKI below 6.12 + IPC
          # configs from arch/arm64/configs/evonix-ds.config. Default OFF —
          # push builds never take this path, and evonix.config itself is
          # NOT touched (fragment is applied ephemerally on the runner copy).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          DS_COMMIT="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$DS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve Droidspaces-OSS tip" >&2; exit 1; }
          echo "Droidspaces-OSS tip: $DS_COMMIT"
          echo "ds_commit=$DS_COMMIT" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$RUNNER_TEMP/Droidspaces-OSS" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/Droidspaces-OSS/.git" ] || { echo "ERROR: Droidspaces-OSS clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/Droidspaces-OSS" fetch --depth=1 origin "$DS_COMMIT"
          git -C "$RUNNER_TEMP/Droidspaces-OSS" checkout "$DS_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/Droidspaces-OSS" rev-parse HEAD)" = "$DS_COMMIT" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
          # SYSVIPC kABI fix for android15-6.6 (same patch file the GKI
          # reference applies for this version; dry-run verified on our tree).
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          # Droidspaces kernel configs from the committed fragment
          # arch/arm64/configs/evonix-ds.config (visible/auditable; same 9
          # symbols as the reference Enable Kernel Configs step, USER_NS off).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          DS_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          DS_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-ds.config"
          test -s "$DS_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d; /^${SYM}=n$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d; /^${SYM}=n$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              CONFIG_*'=n')
                SYM="${LINE%'=n'}"
                sed -i "/^# ${SYM} is not set$/d; /^${SYM}=y$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-ds.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$DS_FRAG"

      - name: Apply NoMount (optional, dispatch only)
        id: nm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nomount }}
        run: |
          set -euo pipefail
          # Optional NoMount VFS hooks (same source the GKI reference uses):
          # kernel/setup.sh wires fs/nomount symlink + fs/Makefile + fs/Kconfig,
          # configs from arch/arm64/configs/evonix-nm.config. Default OFF —
          # push builds never take this path, and the git tree stays clean
          # (integration happens on the runner workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          NM_COMMIT="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1; exit}')"
          [[ "$NM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve NoMount tip" >&2; exit 1; }
          echo "NoMount tip: $NM_COMMIT"
          echo "nm_commit=$NM_COMMIT" >> "$GITHUB_OUTPUT"
          NM_SETUP="$RUNNER_TEMP/nomount-setup-$NM_COMMIT.sh"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NM_COMMIT}/kernel/setup.sh" \
            --output "$NM_SETUP"
          test -s "$NM_SETUP"
          chmod 0755 "$NM_SETUP"
          # Pre-clone at the exact SHA: upstream rewinds dev often, so a fresh
          # clone may no longer contain the pinned tree. (Same as reference.)
          if [ ! -d "$WORK_DIR/common/NoMount" ]; then
            git clone --no-checkout https://github.com/maxsteeel/nomount.git "$WORK_DIR/common/NoMount"
          fi
          git -C "$WORK_DIR/common/NoMount" fetch --depth=1 origin "$NM_COMMIT"
          git -C "$WORK_DIR/common/NoMount" checkout --detach --quiet "$NM_COMMIT"
          ( cd "$WORK_DIR/common" && "$NM_SETUP" "$NM_COMMIT" )
          [ "$(git -C "$WORK_DIR/common/NoMount" rev-parse HEAD)" = "$NM_COMMIT" ] || { echo "NoMount pin mismatch" >&2; exit 1; }
          test -L "$WORK_DIR/common/fs/nomount" || { echo "ERROR: fs/nomount symlink missing" >&2; exit 1; }
          # NoMount kernel configs from the committed fragment
          # arch/arm64/configs/evonix-nm.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          NM_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          NM_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-nm.config"
          test -s "$NM_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$NM_CONFIG"
                grep -qx "$LINE" "$NM_CONFIG" || echo "$LINE" >> "$NM_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$NM_CONFIG"
                grep -qx "$LINE" "$NM_CONFIG" || echo "$LINE" >> "$NM_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-nm.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$NM_FRAG"

      - name: Apply NTSync (optional, dispatch only)
        id: ntsync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ntsync }}
        run: |
          set -euo pipefail
          # Optional NTSync driver (same source the kernel_patches reference
          # ships for android15-6.6): base patch adds drivers/misc/ntsync.c +
          # include/uapi/linux/ntsync.h, the android15-6.6 compat patch wires
          # Kconfig (config NTSYNC) + Makefile. Configs come from the
          # committed fragment arch/arm64/configs/evonix-ntsync.config.
          # Default OFF — push builds never take this path, and the git tree
          # stays clean (patches apply on the runner workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          KP_COMMIT="$(git ls-remote https://github.com/WildKernels/kernel_patches.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$KP_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve kernel_patches tip" >&2; exit 1; }
          echo "kernel_patches tip: $KP_COMMIT"
          echo "ntsync_commit=$KP_COMMIT" >> "$GITHUB_OUTPUT"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/WildKernels/kernel_patches/${KP_COMMIT}/common/ntsync/ntsync_base.patch" \
            --output "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/WildKernels/kernel_patches/${KP_COMMIT}/common/ntsync/ntsync_compat_android15-6.6.patch" \
            --output "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          test -s "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          test -s "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          # Fail-hard guards: driver sources + Kconfig/Makefile wiring.
          test -s "$WORK_DIR/common/drivers/misc/ntsync.c" || { echo "ERROR: drivers/misc/ntsync.c missing after patch" >&2; exit 1; }
          test -s "$WORK_DIR/common/include/uapi/linux/ntsync.h" || { echo "ERROR: include/uapi/linux/ntsync.h missing after patch" >&2; exit 1; }
          grep -q '^config NTSYNC$' "$WORK_DIR/common/drivers/misc/Kconfig" || { echo "ERROR: config NTSYNC missing from drivers/misc/Kconfig" >&2; exit 1; }
          grep -q 'obj-$(CONFIG_NTSYNC)' "$WORK_DIR/common/drivers/misc/Makefile" || { echo "ERROR: NTSYNC obj entry missing from drivers/misc/Makefile" >&2; exit 1; }
          # NTSync kernel configs from the committed fragment
          # arch/arm64/configs/evonix-ntsync.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          NTSYNC_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          NTSYNC_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-ntsync.config"
          test -s "$NTSYNC_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$NTSYNC_CONFIG"
                grep -qx "$LINE" "$NTSYNC_CONFIG" || echo "$LINE" >> "$NTSYNC_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$NTSYNC_CONFIG"
                grep -qx "$LINE" "$NTSYNC_CONFIG" || echo "$LINE" >> "$NTSYNC_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-ntsync.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$NTSYNC_FRAG"

      - name: Apply Baseband-Guard (optional, dispatch only)
        id: bbg
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_bbg }}
        run: |
          set -euo pipefail
          # Optional Baseband-Guard LSM (upstream vc-teahouse/Baseband-guard):
          # kernel-side tree is cloned at a pinned SHA into
          # $WORK_DIR/common/Baseband-guard and wired exactly like the
          # upstream setup.sh cloud-compile path (security/baseband-guard
          # symlink + security/Makefile obj entry + security/Kconfig source
          # entry + CONFIG_LSM defaults extended with baseband_guard).
          # Configs come from the committed fragment
          # arch/arm64/configs/evonix-bbg.config (BBG on, BLOCK_BOOT and
          # BLOCK_RECOVERY OFF so kernels/recovery stay flashable from the
          # running system). Default OFF — push builds never take this path,
          # and the git tree stays clean (integration happens on the runner
          # workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          BBG_COMMIT="$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$BBG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve Baseband-Guard tip" >&2; exit 1; }
          echo "Baseband-Guard tip: $BBG_COMMIT"
          echo "bbg_commit=$BBG_COMMIT" >> "$GITHUB_OUTPUT"
          # Pre-clone at the exact SHA: upstream main moves, so a fresh
          # clone may no longer contain the pinned tree. (Same as NoMount.)
          if [ ! -d "$WORK_DIR/common/Baseband-guard" ]; then
            git clone --no-checkout https://github.com/vc-teahouse/Baseband-guard.git "$WORK_DIR/common/Baseband-guard"
          fi
          git -C "$WORK_DIR/common/Baseband-guard" fetch --depth=1 origin "$BBG_COMMIT"
          git -C "$WORK_DIR/common/Baseband-guard" checkout --detach --quiet "$BBG_COMMIT"
          [ "$(git -C "$WORK_DIR/common/Baseband-guard" rev-parse HEAD)" = "$BBG_COMMIT" ] || { echo "Baseband-Guard pin mismatch" >&2; exit 1; }
          # --- setup.sh wiring, replicated on the pinned tree ---
          SEC_DIR="$WORK_DIR/common/security"
          if command -v realpath >/dev/null 2>&1; then
            BBG_REL="$(realpath --relative-to="$SEC_DIR" "$WORK_DIR/common/Baseband-guard" 2>/dev/null || true)"
          else
            BBG_REL="$WORK_DIR/common/Baseband-guard"
          fi
          [ -n "$BBG_REL" ] || BBG_REL="$WORK_DIR/common/Baseband-guard"
          ln -sfn "$BBG_REL" "$SEC_DIR/baseband-guard"
          test -L "$SEC_DIR/baseband-guard" || { echo "ERROR: security/baseband-guard symlink missing" >&2; exit 1; }
          grep -q 'baseband-guard/' "$SEC_DIR/Makefile" || \
            printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$SEC_DIR/Makefile"
          grep -q 'baseband-guard/' "$SEC_DIR/Makefile" || { echo "ERROR: security/Makefile BBG entry missing" >&2; exit 1; }
          if ! grep -q 'security/baseband-guard/Kconfig' "$SEC_DIR/Kconfig"; then
            awk '
              { a[NR]=$0 } END{
                last=0; for(i=1;i<=NR;i++) if(a[i] ~ /^endmenu[[:space:]]*$/) last=i;
                for(i=1;i<=NR;i++){
                  if(i==last) print "source \"security/baseband-guard/Kconfig\"";
                  print a[i];
                }
              }' "$SEC_DIR/Kconfig" > "$SEC_DIR/Kconfig.tmp" && mv "$SEC_DIR/Kconfig.tmp" "$SEC_DIR/Kconfig"
          fi
          grep -q 'security/baseband-guard/Kconfig' "$SEC_DIR/Kconfig" || { echo "ERROR: security/Kconfig BBG source missing" >&2; exit 1; }
          # CONFIG_LSM defaults: append baseband_guard (same sed as the
          # upstream CI cloud-compile path).
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' "$SEC_DIR/Kconfig"
          grep -q 'baseband_guard' "$SEC_DIR/Kconfig" || { echo "ERROR: CONFIG_LSM defaults lack baseband_guard" >&2; exit 1; }
          # --- rodin allowlist: SAFE SKIP (never fail the build) ---
          # No rodin-specific partition allowlist has been validated, so the
          # upstream-generic allowlist ships as-is. Record the warning for
          # the summary/BuildInfo and continue.
          RODIN_LIST="$WORK_DIR/common/arch/arm64/configs/evonix-bbg-rodin.allowlist"
          if [ -s "$RODIN_LIST" ]; then
            echo "BBG rodin allowlist override present — device-specific list in effect."
            echo "bbg_allowlist=rodin" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BBG uses the upstream-generic partition allowlist; no rodin-specific allowlist validated — modem/efisp/abl behaviour must still be validated on-device (see summary)."
            echo "BBG WARNING: upstream-generic allowlist in effect (no evonix-bbg-rodin.allowlist). On-device validation still required." >> "$GITHUB_STEP_SUMMARY"
            echo "bbg_allowlist=generic" >> "$GITHUB_OUTPUT"
          fi
          # BBG kernel configs from the committed fragment
          # arch/arm64/configs/evonix-bbg.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          BBG_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          BBG_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-bbg.config"
          test -s "$BBG_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$BBG_CONFIG"
                grep -qx "$LINE" "$BBG_CONFIG" || echo "$LINE" >> "$BBG_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$BBG_CONFIG"
                grep -qx "$LINE" "$BBG_CONFIG" || echo "$LINE" >> "$BBG_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-bbg.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$BBG_FRAG"

      - name: Restore Bazel cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
        uses: actions/cache@v4
        with:
          # Real Bazel output root: build-evonix.sh locates the generated
          # .config under $WORKSPACE/out/bazel/output_user_root and never
          # passes --output_base, so ~/.cache/bazel is never written.
          path: ${{ env.WORK_DIR }}/out/bazel/output_user_root
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}
          restore-keys: |
            evonix-bazel-${{ github.ref_name }}-

      - name: Set up Clang 23 toolchain
        run: |
          set -euo pipefail
          EVONIX_WORKSPACE="$WORK_DIR" bash "$WORK_DIR/common/setup-clang23.sh"

      - name: Build via build-evonix.sh
        run: |
          set -euo pipefail
          bash "$WORK_DIR/common/build-evonix.sh" "$DIST_DIR"

      - name: Verify Image + vmlinux
        run: |
          set -euo pipefail
          test -s "$DIST_DIR/Image"
          test -s "$DIST_DIR/vmlinux"
          ls -la "$DIST_DIR"
          sha256sum "$DIST_DIR/Image" | tee "$DIST_DIR/Image.sha256"
          # BBR3 self-testimony: every build proves BBR3 was compiled in.
          # Primary: CONFIG_TCP_CONG_BBR3=y in the generated final .config
          # (same locate pattern as build-evonix.sh). Secondary: bbr3 symbol
          # in System.map when the dist carries one.
          BBR3_CFG="$(find "$WORK_DIR/out/bazel/output_user_root" -path '*kernel_aarch64_config/out_dir/.config' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          [ -n "$BBR3_CFG" ] || { echo "ERROR: final kernel .config not found" >&2; exit 1; }
          grep -qx 'CONFIG_TCP_CONG_BBR3=y' "$BBR3_CFG" || { echo "ERROR: CONFIG_TCP_CONG_BBR3=y missing from final .config ($BBR3_CFG)" >&2; exit 1; }
          grep -E '^CONFIG_TCP_CONG_BBR' "$BBR3_CFG" || true
          if [ -f "$DIST_DIR/System.map" ]; then grep -q 'bbr3' "$DIST_DIR/System.map" || { echo "ERROR: no bbr3 symbol in System.map" >&2; exit 1; }; fi

      - name: Save Bazel cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.use_cache) }}
        uses: actions/cache/save@v4
        with:
          # Same real Bazel output root as Restore (see comment there).
          path: ${{ env.WORK_DIR }}/out/bazel/output_user_root
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            coloros/*) VARIANT="COS" ;;
            hyperos/*) VARIANT="HOS" ;;
            *) echo "Unknown branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac
          KVER="$(grep -m1 '^SUBLEVEL' src/Makefile | awk '{print $3}')"
          KEXTRA="$(grep -m1 '^EXTRAVERSION' src/Makefile | awk '{print $3}')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP_NAME="EVONIX-${VARIANT}-6.6.${KVER}-${SHORT_SHA}.zip"
          BASE="${ZIP_NAME%.zip}"
          echo "ARTIFACT_NAME=$BASE" >> "$GITHUB_ENV"
          rm -rf AnyKernel3
          AK3_COMMIT="$(git ls-remote https://github.com/osm0sis/AnyKernel3.git refs/heads/master | awk '{print $1; exit}')"
          [ -n "$AK3_COMMIT" ] || { echo "ERROR: could not resolve AnyKernel3 master tip" >&2; exit 1; }
          echo "AK3_COMMIT=$AK3_COMMIT" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3 && break || sleep 5; done
          [ -d AnyKernel3/.git ] || { echo "ERROR: AnyKernel3 clone failed" >&2; exit 1; }
          git -C AnyKernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C AnyKernel3 checkout "$AK3_COMMIT"
          [ "$(git -C AnyKernel3 rev-parse HEAD)" = "$AK3_COMMIT" ] || { echo "AnyKernel3 pin mismatch" >&2; exit 1; }
          rm -rf AnyKernel3/.git
          # AArch64 tools: master ships 32-bit ARM tools that OrangeFox on
          # rodin cannot exec (Exec format error in setup_bb). Replace with
          # OSM-native 64-bit tools from the arm64-tools branch (same author).
          AK3_TOOLS_COMMIT="$(git ls-remote https://github.com/osm0sis/AnyKernel3.git refs/heads/arm64-tools | awk '{print $1; exit}')"
          [ -n "$AK3_TOOLS_COMMIT" ] || { echo "ERROR: could not resolve AnyKernel3 arm64-tools tip" >&2; exit 1; }
          echo "AK3_TOOLS_COMMIT=$AK3_TOOLS_COMMIT" >> "$GITHUB_ENV"
          echo "AnyKernel3 arm64-tools tip: $AK3_TOOLS_COMMIT"
          for i in 1 2 3 4 5; do rm -rf "$RUNNER_TEMP/ak3-arm64tools" && git clone --depth=1 -b arm64-tools https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/ak3-arm64tools" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/ak3-arm64tools/.git" ] || { echo "ERROR: AnyKernel3 arm64-tools clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/ak3-arm64tools" fetch --depth=1 origin "$AK3_TOOLS_COMMIT"
          git -C "$RUNNER_TEMP/ak3-arm64tools" checkout "$AK3_TOOLS_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/ak3-arm64tools" rev-parse HEAD)" = "$AK3_TOOLS_COMMIT" ] || { echo "AnyKernel3 arm64-tools pin mismatch" >&2; exit 1; }
          for T in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            test -s "$RUNNER_TEMP/ak3-arm64tools/$T" || { echo "ERROR: arm64-tools missing: $T" >&2; exit 1; }
            cp -a "$RUNNER_TEMP/ak3-arm64tools/$T" AnyKernel3/tools/$T
          done
          chmod 755 AnyKernel3/tools/busybox AnyKernel3/tools/fec AnyKernel3/tools/httools_static AnyKernel3/tools/lptools_static AnyKernel3/tools/magiskboot AnyKernel3/tools/magiskpolicy AnyKernel3/tools/snapshotupdater_static
          rm -rf "$RUNNER_TEMP/ak3-arm64tools"
          # Fail-hard: tools must be AArch64 (e_machine 0xB7), else recovery
          # dies in setup_bb with Exec format error.
          for BIN in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            MACH="$(od -A n -t x1 -j 18 -N 2 "AnyKernel3/tools/$BIN" | tr -d ' \n')"
            [ "$MACH" = "b700" ] || { echo "ERROR: AnyKernel3/tools/$BIN not AArch64 (e_machine=$MACH)" >&2; exit 1; }
          done
          # Raw uncompressed Image only (GKI/AK3 convention: ak3-core +
          # magiskboot handle compression at repack; Image.lz4 would be wrong).
          cp -a "$DIST_DIR/Image" AnyKernel3/Image
          test -s AnyKernel3/Image
          # EVONIX branding + OSM port. The osm0sis master template is a
          # tuna-era sample (devicecheck on, omap BLOCK, slot detection off,
          # dump_boot plus tuna ramdisk edits), so normalize it here to the
          # EVONIX GKI layout: device check OFF via manual override below
          # (not an upstream default) so the zip also flashes on custom ROMs
          # where ro.product.device differs from stock rodin; BLOCK boot with
          # auto slot handling, stock ramdisk flow, vbmeta auto, no modules.
          # Pre-checks below fail hard if the upstream template drifts.
          sed -i 's|^kernel.string=.*|kernel.string=EVONIX '"${VARIANT}"' 6.6.'"${KVER}"' by Tomkun-desu @ '"${SHORT_SHA}"'|' AnyKernel3/anykernel.sh
          # --- OSM port: normalize the tuna template to the EVONIX GKI layout.
          # Pre-checks below fail the step under set -e if upstream drifts. ---
          grep -qx 'do.devicecheck=1' AnyKernel3/anykernel.sh
          grep -qx 'do.systemless=1' AnyKernel3/anykernel.sh
          grep -qx 'device.name1=maguro' AnyKernel3/anykernel.sh
          grep -qx 'device.name2=toro' AnyKernel3/anykernel.sh
          grep -qx 'device.name3=toroplus' AnyKernel3/anykernel.sh
          grep -qx 'device.name4=tuna' AnyKernel3/anykernel.sh
          grep -qx 'device.name5=' AnyKernel3/anykernel.sh
          grep -qx 'BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;' AnyKernel3/anykernel.sh
          grep -qx 'IS_SLOT_DEVICE=0;' AnyKernel3/anykernel.sh
          grep -qx 'PATCH_VBMETA_FLAG=auto;' AnyKernel3/anykernel.sh
          grep -qx 'dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk' AnyKernel3/anykernel.sh
          grep -qx '# boot install' AnyKernel3/anykernel.sh
          grep -qx '## end boot install' AnyKernel3/anykernel.sh
          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/^do\.systemless=.*/do.systemless=0/' AnyKernel3/anykernel.sh
          sed -i -E 's/^(device\.name[0-9]*)=.*/\1=/' AnyKernel3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' AnyKernel3/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' AnyKernel3/anykernel.sh
          grep -qx 'NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh && { echo "ERROR: unexpected upstream NO_MAGISK_CHECK" >&2; exit 1; }
          sed -i '/^PATCH_VBMETA_FLAG=auto;$/a NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh
          sed -i '/^boot_attributes() {$/,/^} # end attributes$/d' AnyKernel3/anykernel.sh
          printf '%s\n' \
            '# boot install' \
            '' \
            '# GKI kernel version check (KernelSU supports 5.10/5.15/6.1/6.6/6.12)' \
            "kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')" \
            'case $kernel_version in' \
            '    5.10*|5.15*|6.1*|6.6*|6.12*) ksu_supported=true ;;' \
            '    *) ksu_supported=false ;;' \
            'esac' \
            '' \
            "ui_print \" \" \"  -> EVONIX Supported: \$ksu_supported\"" \
            "\$ksu_supported || abort \"  -> Non-GKI device, abort.\"" \
            '' \
            'split_boot' \
            '' \
            "if [ -f \"\$SPLITIMG/ramdisk.cpio\" ]; then" \
            '    unpack_ramdisk' \
            '    write_boot' \
            'else' \
            '    flash_boot' \
            'fi' \
            '## end boot install' \
            > "$RUNNER_TEMP/evonix-gki-section.txt"
          awk -v SECTION="$RUNNER_TEMP/evonix-gki-section.txt" '
            /^# boot install$/ { while ((getline LINE < SECTION) > 0) print LINE; SKIP=1; next }
            SKIP { if (/^## end boot install$/) SKIP=0; next }
            { print }
          ' AnyKernel3/anykernel.sh > AnyKernel3/anykernel.sh.new
          mv AnyKernel3/anykernel.sh.new AnyKernel3/anykernel.sh
          # EVONIX flash-time banner: upstream osm0sis ships no banner file,
          # so create ours here. update-binary prints 'banner' via
          # ui_printfile, then kernel.string, so this file is the
          # flash-time logo (plain ASCII, 38 cols).
          printf '%s\n' \
            '+====================================+' \
            '|                                    |' \
            '|            E V O N I X             |' \
            '|           by Tomkun-desu           |' \
            '|                                    |' \
            '|------------------------------------|' \
            '|  All rights belong to Mr. NEESCHAL |' \
            '+====================================+' \
            > AnyKernel3/banner
          # OSM port guards: fail hard on any drift from the EVONIX GKI layout.
          grep -qx 'do.devicecheck=0' AnyKernel3/anykernel.sh
          grep -qx 'do.systemless=0' AnyKernel3/anykernel.sh
          grep -qx 'do.modules=0' AnyKernel3/anykernel.sh
          grep -qx 'BLOCK=boot;' AnyKernel3/anykernel.sh
          grep -qx 'IS_SLOT_DEVICE=auto;' AnyKernel3/anykernel.sh
          grep -qx 'NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh
          grep -qx 'split_boot' AnyKernel3/anykernel.sh
          grep -qF '5.10*|5.15*|6.1*|6.6*|6.12*' AnyKernel3/anykernel.sh
          if grep -q 'init\.tuna\|fstab\.tuna\|maguro\|toro\|tuna\|device\.name[0-9]*=[^[:space:]]' AnyKernel3/anykernel.sh; then echo "ERROR: tuna template remnant in anykernel.sh" >&2; exit 1; fi
          if grep -q '^dump_boot' AnyKernel3/anykernel.sh; then echo "ERROR: dump_boot remnant in anykernel.sh" >&2; exit 1; fi
          if grep -q '^boot_attributes' AnyKernel3/anykernel.sh; then echo "ERROR: boot_attributes remnant in anykernel.sh" >&2; exit 1; fi
          # Direct-flashable staging: the artifact itself IS the flashable tree.
          # upload-artifact re-zips `path`, so STAGE holds the AK3 layout at
          # top level (META-INF/anykernel.sh/Image/banner) plus the BuildInfo
          # manifest + Image.sha256. No inner versioned zip — the downloaded
          # <ARTIFACT_NAME>.zip flashes directly with no extraction step.
          # AK3 layout guards on the source dir.
          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/Image
          test -d AnyKernel3/META-INF
          test -f AnyKernel3/banner
          IMG_SIZE="$(stat -c%s AnyKernel3/Image)"
          IMG_SHA="$(sha256sum AnyKernel3/Image | cut -d' ' -f1)"
          KSU_PIN="${{ steps.ksu-latest.outputs.ksu_sha }}"
          # KSU always runs (no `if:` on ksu-latest): an empty pin means the
          # step failed to publish ksu_sha — fail hard, never ship unknown KSU.
          # (DS/NM are optional/conditional: empty there is valid, handled below.)
          [ -n "$KSU_PIN" ] || { echo "ERROR: KSU_PIN is empty (ksu_sha missing)" >&2; exit 1; }
          DS_PIN="${{ steps.ds.outputs.ds_commit }}"
          NM_PIN="${{ steps.nm.outputs.nm_commit }}"
          NTSYNC_PIN="${{ steps.ntsync.outputs.ntsync_commit }}"
          BBG_PIN="${{ steps.bbg.outputs.bbg_commit }}"
          SUSFS_PIN="${{ steps.susfs.outputs.susfs_commit }}"
          # SUSFS always runs (no `if:` on susfs): an empty pin means the
          # step failed to publish susfs_commit — fail hard, never ship
          # unknown SUSFS.
          [ -n "$SUSFS_PIN" ] || { echo "ERROR: SUSFS_PIN is empty (susfs_commit missing)" >&2; exit 1; }
          SUSFS_VER="${{ steps.susfs.outputs.susfs_ver }}"
          [ -n "$SUSFS_VER" ] || { echo "ERROR: SUSFS_VER is empty (susfs_ver missing)" >&2; exit 1; }
          DS_STATUS="disabled"; [ -n "$DS_PIN" ] || DS_PIN="n/a"
          if [ "${DS_PIN}" != "n/a" ]; then DS_STATUS="enabled ($DS_PIN)"; fi
          NM_STATUS="disabled"; [ -n "$NM_PIN" ] || NM_PIN="n/a"
          if [ "${NM_PIN}" != "n/a" ]; then NM_STATUS="enabled ($NM_PIN)"; fi
          NTSYNC_STATUS="disabled"; [ -n "$NTSYNC_PIN" ] || NTSYNC_PIN="n/a"
          if [ "${NTSYNC_PIN}" != "n/a" ]; then NTSYNC_STATUS="enabled ($NTSYNC_PIN)"; fi
          BBG_STATUS="disabled"; [ -n "$BBG_PIN" ] || BBG_PIN="n/a"
          if [ "${BBG_PIN}" != "n/a" ]; then
            BBG_ALLOW="${{ steps.bbg.outputs.bbg_allowlist }}"; BBG_ALLOW="${BBG_ALLOW:-generic}"
            BBG_STATUS="enabled ($BBG_PIN, allowlist: $BBG_ALLOW)"
          fi
          # SUSFS_VER comes from the susfs step output (fail-hard above);
          # never re-read it from the tree (susfs.h is not in-tree).
          KSTRING="$(grep -m1 '^kernel.string=' AnyKernel3/anykernel.sh | cut -d= -f2-)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # inputs.* is empty on push — default gracefully.
          IN_REL="${{ inputs.release_type }}"; IN_REL="${IN_REL:-Action (push)}"
          IN_CACHE="${{ inputs.use_cache }}"; IN_CACHE="${IN_CACHE:-true}"
          IN_DS="${{ inputs.use_ds }}"; IN_DS="${IN_DS:-false}"
          IN_NM="${{ inputs.use_nomount }}"; IN_NM="${IN_NM:-false}"
          IN_NTSYNC="${{ inputs.use_ntsync }}"; IN_NTSYNC="${IN_NTSYNC:-false}"
          IN_BBG="${{ inputs.use_bbg }}"; IN_BBG="${IN_BBG:-false}"
          STAGE="evonix-artifact"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -a AnyKernel3/. "$STAGE/"
          ( cd "$STAGE" && sha256sum Image > Image.sha256 )
          cat > "$STAGE/BuildInfo-$BASE.md" <<EOF
          # EVONIX BuildInfo — $BASE
          - Branch: ${{ github.ref_name }}
          - Commit: $GITHUB_SHA (short: $SHORT_SHA)
          - Kernel: 6.6.$KVER ($KEXTRA)
          - KernelSU-Next: $KSU_PIN (dev-susfs @ pershoot/KernelSU-Next)
          - SUSFS: $SUSFS_VER ($SUSFS_PIN, floating gki-android15-6.6 tip @ simonpunk/susfs4ksu)
          - Droidspaces: $DS_STATUS
          - NoMount: $NM_STATUS
          - NTSync: $NTSYNC_STATUS
          - Baseband-Guard: $BBG_STATUS
          - AnyKernel3: $AK3_COMMIT (master @ osm0sis/AnyKernel3)
          - AnyKernel3 tools: $AK3_TOOLS_COMMIT (arm64-tools @ osm0sis/AnyKernel3, AArch64)
          - Toolchain: Clang 23.0.1 (android build 16311247, r614150) + ThinLTO + AutoFDO
          - Build date: $BUILD_DATE
          - Inputs: release_type=$IN_REL, use_cache=$IN_CACHE, use_ds=$IN_DS, use_nomount=$IN_NM, use_ntsync=$IN_NTSYNC, use_bbg=$IN_BBG
          - kernel.string: $KSTRING
          - Image: $IMG_SIZE bytes, sha256 $IMG_SHA
          - Artifact: $BASE.zip (direct-flashable — AK3 top level + this BuildInfo, no inner zip)
          EOF
          # Throwaway re-zip proves the staged tree zips cleanly; log entries.
          rm -f "_verify_$BASE.zip"
          ( cd "$STAGE" && zip -r -q -9 "../_verify_$BASE.zip" . )
          ZIP_LIST="$(unzip -l "_verify_$BASE.zip")"
          echo "$ZIP_LIST"
          for ENTRY in 'META-INF/' 'anykernel.sh' 'Image' 'banner' "BuildInfo-$BASE.md" 'Image.sha256'; do
            grep -q "$ENTRY" <<<"$ZIP_LIST" || { echo "ERROR: staged artifact missing entry: $ENTRY" >&2; exit 1; }
          done
          rm -f "_verify_$BASE.zip"
          # English-only build summary: config matrix → artifact result.
          {
            echo "## EVONIX Build — $BASE"
            echo ""
            echo "Event: ${{ github.event_name }} | Branch: ${{ github.ref_name }}"
            echo ""
            echo "| inputs (use_ds/use_nomount/use_ntsync/use_bbg/use_cache/release_type) | Result |"
            echo "|---|---|"
            echo "| $IN_DS / $IN_NM / $IN_NTSYNC / $IN_BBG / $IN_CACHE / $IN_REL | 🗜️ $BASE.zip — direct-flashable, Image $IMG_SIZE bytes, sha256 \`${IMG_SHA:0:16}…\` |"
            echo ""
            echo "| Pin | Value |"
            echo "|---|---|"
            echo "| KSU-Next | \`${KSU_PIN:-n/a}\` |"
            echo "| SUSFS | \`$SUSFS_VER ($SUSFS_PIN)\` |"
            echo "| Droidspaces | \`$DS_STATUS\` |"
            echo "| NoMount | \`$NM_STATUS\` |"
            echo "| NTSync | \`$NTSYNC_STATUS\` |"
            echo "| Baseband-Guard | \`$BBG_STATUS\` |"
            echo "| AnyKernel3 | \`${AK3_COMMIT:-n/a}\` |"
            if [ "$IN_BBG" = "true" ]; then
              echo ""
            echo "> ⚠️ BBG built with the upstream-generic allowlist (no validated rodin list) — on-device validation for modem/efisp/abl/modemst/fsg/fsc partitions is still required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EVONIX artifact (zip + sha256 + BuildInfo)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/evonix-artifact/
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Release' || inputs.release_type == 'Pre-Release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (build metadata)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download EVONIX artifact (zip + sha256 + BuildInfo)
        uses: actions/download-artifact@v4
        with:
          pattern: EVONIX-*
          path: evonix-artifact
          merge-multiple: true

      - name: Create GitHub release (auto tag evonix-vN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          # KSU SHA comes from the build job output (submodule is unpinned at
          # build time); fallback to live tip resolve if the output is empty.
          KSU_PIN="${{ needs.build.outputs.ksu_sha }}"
          [ -n "$KSU_PIN" ] || KSU_PIN="$(git ls-remote https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs | awk '{print $1; exit}')"
          DS_PIN="${{ needs.build.outputs.ds_commit }}"
          DS_STATUS="disabled"
          if [ "${{ inputs.use_ds }}" = "true" ]; then
            [ -n "$DS_PIN" ] || DS_PIN="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
            DS_STATUS="enabled ($DS_PIN)"
          fi
          NM_PIN="${{ needs.build.outputs.nm_commit }}"
          NM_STATUS="disabled"
          if [ "${{ inputs.use_nomount }}" = "true" ]; then
            [ -n "$NM_PIN" ] || NM_PIN="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1; exit}')"
            NM_STATUS="enabled ($NM_PIN)"
          fi
          NTSYNC_PIN="${{ needs.build.outputs.ntsync_commit }}"
          NTSYNC_STATUS="disabled"
          if [ "${{ inputs.use_ntsync }}" = "true" ]; then
            [ -n "$NTSYNC_PIN" ] || NTSYNC_PIN="$(git ls-remote https://github.com/WildKernels/kernel_patches.git refs/heads/main | awk '{print $1; exit}')"
            NTSYNC_STATUS="enabled ($NTSYNC_PIN)"
          fi
          BBG_PIN="${{ needs.build.outputs.bbg_commit }}"
          BBG_STATUS="disabled"
          if [ "${{ inputs.use_bbg }}" = "true" ]; then
            [ -n "$BBG_PIN" ] || BBG_PIN="$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | awk '{print $1; exit}')"
            BBG_ALLOW="${{ needs.build.outputs.bbg_allowlist }}"; BBG_ALLOW="${BBG_ALLOW:-generic}"
            BBG_STATUS="enabled ($BBG_PIN, allowlist: $BBG_ALLOW)"
          fi
          # SUSFS pin/ver come from the build job outputs (floating tip,
          # resolved at build time); fallback to live tip resolve.
          SUSFS_PIN="${{ needs.build.outputs.susfs_commit }}"
          [ -n "$SUSFS_PIN" ] || SUSFS_PIN="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android15-6.6 | awk '{print $1; exit}')"
          SUSFS_VER="${{ needs.build.outputs.susfs_ver }}"
          [ -n "$SUSFS_VER" ] || SUSFS_VER="unknown"
          KEXTRA="$(grep -m1 '^EXTRAVERSION' Makefile | awk '{print $3}')"
          mapfile -t TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^evonix-v[0-9]+$' || true)
          MAX=0
          for T in ${TAGS[@]:-}; do
            N="${T#evonix-v}"
            if [[ "$N" =~ ^[0-9]+$ && "$N" -gt "$MAX" ]]; then MAX="$N"; fi
          done
          TAG="evonix-v$((MAX + 1))"
          echo "Tag: $TAG (branch $BRANCH @ ${COMMIT:0:12})"
          cat > "BuildInfo-$TAG.md" <<EOF
          # EVONIX $TAG
          - Branch: $BRANCH
          - Commit: $COMMIT
          - Kernel: 6.6.x ($KEXTRA)
          - KernelSU-Next: $KSU_PIN (latest dev-susfs @ pershoot/KernelSU-Next)
          - SUSFS: $SUSFS_VER ($SUSFS_PIN, floating gki-android15-6.6 tip @ simonpunk/susfs4ksu)
          - Droidspaces: $DS_STATUS
          - NoMount: $NM_STATUS
          - NTSync: $NTSYNC_STATUS
          - Baseband-Guard: $BBG_STATUS
          - Toolchain: Clang 23.0.1 (android build 16311247, r614150) + ThinLTO + AutoFDO
          - Device: Poco X7 Pro (rodin)
          EOF
          CREATE_ARGS=(--title "EVONIX $TAG ($BRANCH)" --notes-file "BuildInfo-$TAG.md")
          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then CREATE_ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "BuildInfo-$TAG.md"
          else
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi
          # The artifact payload is the raw AK3 tree (direct-flashable, no
          # inner zip). Re-zip it here into the versioned release zip.
          ls -la evonix-artifact/
          INFOS=(evonix-artifact/BuildInfo-*.md)
          [ "${#INFOS[@]}" -eq 1 ] || { echo "ERROR: expected 1 BuildInfo in artifact, found ${#INFOS[@]}" >&2; exit 1; }
          BASE="$(basename "${INFOS[0]}" .md)"; BASE="${BASE#BuildInfo-}"
          ZIP_NAME="$BASE.zip"
          test -f evonix-artifact/anykernel.sh
          test -f evonix-artifact/Image
          test -d evonix-artifact/META-INF
          rm -f "$ZIP_NAME" "$ZIP_NAME.sha256"
          ( cd evonix-artifact && zip -r -q -9 "../$ZIP_NAME" . )
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"
          unzip -l "$ZIP_NAME"
          # Release ships the versioned flashable zip + its sha256 + both
          # BuildInfo manifests (tag notes + in-artifact manifest).
          FILES=(BuildInfo-"$TAG".md "$ZIP_NAME" "$ZIP_NAME.sha256" "${INFOS[0]}")
          FAILED=0
          for F in "${FILES[@]}"; do
            OK=false
            for ATTEMPT in 1 2 3; do
              if gh release upload "$TAG" "$F" --clobber; then OK=true; break; fi
              echo "Attempt $ATTEMPT/3 failed for: $F" >&2
              sleep 10
            done
            [ "$OK" = true ] || FAILED=1
          done
          exit "$FAILED"
