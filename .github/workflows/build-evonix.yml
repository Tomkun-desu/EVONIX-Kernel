name: EVONIX Kernel Build

# Kleaf (Bazel) build of the current branch. Branch-agnostic: works identically
# on coloros/ksu-susfs and hyperos/ksu-susfs — the branch itself selects the
# EXTRAVERSION (COS vs HOS) and defconfig fragment.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      use_cache:
        description: "Restore/save Bazel cache"
        type: boolean
        default: true
      use_ds:
        description: "Droidspaces-OSS (SYSVIPC kABI fix + IPC configs)"
        type: boolean
        default: false
      use_nomount:
        description: "NoMount VFS hooks + CONFIG_NOMOUNT"
        type: boolean
        default: false
      use_ntsync:
        description: "NTSync driver (Wine/Proton sync primitives) + CONFIG_NTSYNC"
        type: boolean
        default: false
      use_wifi:
        description: "RTL8821AU USB WiFi (monitor mode + injection) + WLAN/CFG80211 stack"
        type: boolean
        default: false
      use_bbg:
        description: "Baseband-Guard LSM + CONFIG_BBG (generic allowlist until rodin validated)"
        type: boolean
        default: false
      susfs_pin:
        description: "SUSFS pin (40-char sha). Empty = floating tip of gki-android15-6.6"
        type: string
        default: ""
  push:
    branches:
      - coloros/ksu-susfs
      - hyperos/ksu-susfs
    paths-ignore:
      - "**/*.md"
      - "Documentation/**"

env:
  SRC_DIR: ${{ github.workspace }}/src
  WORK_DIR: ${{ github.workspace }}/evonix-workspace
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ksu_sha: ${{ steps.ksu-latest.outputs.ksu_sha }}
      susfs_commit: ${{ steps.susfs.outputs.susfs_commit }}
      susfs_ver: ${{ steps.susfs.outputs.susfs_ver }}
      susfs_fallback: ${{ steps.susfs.outputs.susfs_fallback }}
      ds_commit: ${{ steps.ds.outputs.ds_commit }}
      nm_commit: ${{ steps.nm.outputs.nm_commit }}
      ntsync_commit: ${{ steps.ntsync.outputs.ntsync_commit }}
      wifi_commit: ${{ steps.wifi.outputs.wifi_commit }}
      bbg_commit: ${{ steps.bbg.outputs.bbg_commit }}
      bbg_allowlist: ${{ steps.bbg.outputs.bbg_allowlist }}
    steps:
      - name: Checkout current branch (+ submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          submodules: recursive
          path: src

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          testing: false

      - name: Add 16 GB swap (ThinLTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Set up repo-manifest workspace (per BUILDING.md)
        run: |
          set -euo pipefail
          git config --global safe.directory '*'
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core curl rsync python3
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android15-6.6-lts --depth=1
          # repo sync is resumable/idempotent: retry the whole sync on
          # transient fetch failures (HTTP 503 from googlesource hits the
          # huge prebuilts repos first). Each attempt continues where the
          # previous one stopped.
          for i in 1 2 3; do repo sync -c -j"$(nproc)" && break || { [ "$i" -eq 3 ] && exit 1; sleep 30; }; done
          # This repo IS the common/ project: replace the manifest's common/
          # with the checked-out EVONIX source (keeps EVONIX .git history).
          rm -rf "$WORK_DIR/common"
          cp -a "$SRC_DIR" "$WORK_DIR/common"

      - name: Init KernelSU-Next submodule (latest upstream)
        id: ksu-latest
        run: |
          set -euo pipefail
          cd "$WORK_DIR/common"
          git submodule update --init --recursive
          git ls-tree HEAD KernelSU-Next
          # Unpinned: resolve the tip of pershoot/dev-susfs (same source the
          # GKI reference uses when SUSFS is on) and check it out, so every
          # build uses the latest KernelSU-Next.
          # (Same resolve-then-verify pattern as AnyKernel3 packaging below.)
          KSU_URL="https://github.com/pershoot/KernelSU-Next.git"
          KSU_TIP="$(git ls-remote "$KSU_URL" refs/heads/dev-susfs | awk '{print $1; exit}')"
          [[ "$KSU_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve KernelSU-Next tip" >&2; exit 1; }
          echo "KernelSU-Next tip: $KSU_TIP"
          echo "ksu_sha=$KSU_TIP" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            # Kbuild (kernel/Kbuild) derives version as 30000 + rev-list --count
            # of merge-base(HEAD, origin/dev) and tag via describe --tags: a
            # depth-1 detached SHA has count=1 (=> 30001) and no tags (=> empty
            # tag). Fetch branch refs + tags with full history and check out
            # the branch so abbrev-ref/merge-base/describe resolve correctly.
            git -C KernelSU-Next fetch --unshallow --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            || git -C KernelSU-Next fetch --tags "$KSU_URL" \
              "+refs/heads/dev-susfs:refs/remotes/origin/dev-susfs" \
              "+refs/heads/dev:refs/remotes/origin/dev" \
            && break || { [ "$i" -eq 3 ] && exit 1; sleep 10; }
          done
          git -C KernelSU-Next checkout -B dev-susfs "$KSU_TIP"
          [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_TIP" ] || { echo "KernelSU-Next pin mismatch" >&2; exit 1; }
          test -d drivers/kernelsu

      - name: Apply SUSFS floating (tip of gki-android15-6.6)
        id: susfs
        env:
          # Dispatch override (empty on push -> floating tip).
          SUSFS_PIN_INPUT: ${{ inputs.susfs_pin }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Floating SUSFS (Wild-style, single-version): every build resolves
          # the tip of gki-android15-6.6 fresh and applies it onto the runner
          # copy. The git tree carries NO susfs sources, NO hooks and NO
          # CONFIG_KSU_SUSFS* in evonix.config; hooks+configs land
          # ephemerally here. KSU (dev-susfs fork) untouched.
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_MIRROR="https://github.com/ShirkNeko/susfs4ksu.git"
          SUSFS_BRANCH="gki-android15-6.6"
          SUSFS_TIP=""
          # Optional dispatch override: force a known-good sha (empty on push).
          if [ -n "${SUSFS_PIN_INPUT:-}" ]; then
            [[ "$SUSFS_PIN_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: susfs_pin must be a 40-char sha" >&2; exit 1; }
            SUSFS_TIP="$SUSFS_PIN_INPUT"
            echo "SUSFS pin forced by dispatch input: $SUSFS_TIP"
          fi
          if [ -z "$SUSFS_TIP" ]; then
            for remote in "$SUSFS_URL" "$SUSFS_MIRROR"; do
              for i in 1 2 3 4 5; do SUSFS_TIP="$(git ls-remote "$remote" "refs/heads/$SUSFS_BRANCH" | awk '{print $1; exit}' || true)"; [[ "$SUSFS_TIP" =~ ^[0-9a-f]{40}$ ]] && break || { SUSFS_TIP=""; sleep 15; }; done
              if [[ "$SUSFS_TIP" =~ ^[0-9a-f]{40}$ ]]; then SUSFS_URL="$remote"; break; fi
            done
          fi
          [[ "$SUSFS_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve SUSFS tip" >&2; exit 1; }
          [ "$SUSFS_URL" = "$SUSFS_MIRROR" ] && echo "WARNING: GitLab unreachable, building SUSFS from GitHub mirror ($SUSFS_MIRROR)" >&2
          echo "SUSFS tip: $SUSFS_TIP"
          # ---- staging: exact pin + sources + version (reused by the fallback)
          ensure_susfs_pin() {
            local pin="$1" remote i
            for remote in "$SUSFS_URL" "$SUSFS_MIRROR"; do
              if [ ! -d "$RUNNER_TEMP/susfs4ksu/.git" ]; then
                for i in 1 2 3 4 5; do rm -rf "${RUNNER_TEMP:?}/susfs4ksu"; git clone --depth=1 -b "$SUSFS_BRANCH" "$remote" "$RUNNER_TEMP/susfs4ksu" && break || sleep 5; done
              fi
              [ -d "$RUNNER_TEMP/susfs4ksu/.git" ] || continue
              for i in 1 2 3; do git -C "$RUNNER_TEMP/susfs4ksu" fetch --depth=1 origin "$pin" >/dev/null 2>&1 && git -C "$RUNNER_TEMP/susfs4ksu" checkout -q "$pin" >/dev/null 2>&1 && break || sleep 10; done
              if [ "$(git -C "$RUNNER_TEMP/susfs4ksu" rev-parse HEAD 2>/dev/null || true)" = "$pin" ]; then return 0; fi
              rm -rf "${RUNNER_TEMP:?}/susfs4ksu"
            done
            return 1
          }
          stage_susfs() {
            local pin="$1"
            ensure_susfs_pin "$pin" || { echo "ERROR: could not fetch SUSFS pin $pin from GitLab or the mirror" >&2; return 1; }
            # Drop whatever a previous attempt staged, so the fallback pin lands
            # on a clean tree. The tree carries no susfs sources of its own
            # (verified floating), so anything matching here came from us.
            rm -f "$WORK_DIR/common/fs/susfs.c" "$WORK_DIR/common/include/linux/susfs.h" \
                  "$WORK_DIR/common/include/linux/susfs_def.h" "$WORK_DIR/common/"50_add_susfs_in_*.patch
            # Resolve the 50_add patch by glob (exactly one must match): survives
            # an upstream rename, fails LOUD on zero/multiple matches.
            SUSFS_PATCH_CANDIDATES=( "$RUNNER_TEMP"/susfs4ksu/kernel_patches/50_add_susfs_in_*.patch )
            [ "${#SUSFS_PATCH_CANDIDATES[@]}" -eq 1 ] || { echo "ERROR: expected exactly one 50_add_susfs patch, found ${#SUSFS_PATCH_CANDIDATES[@]} at $pin" >&2; return 1; }
            SUSFS_PATCH="$(basename "${SUSFS_PATCH_CANDIDATES[0]}")"
            cp -f "$RUNNER_TEMP/susfs4ksu/kernel_patches/fs/"* "$WORK_DIR/common/fs/"
            cp -f "$RUNNER_TEMP/susfs4ksu/kernel_patches/include/linux/"* "$WORK_DIR/common/include/linux/"
            cp -f "$RUNNER_TEMP/susfs4ksu/kernel_patches/$SUSFS_PATCH" "$WORK_DIR/common/"
            SUSFS_VER="$(grep -m1 '#define SUSFS_VERSION' "$RUNNER_TEMP/susfs4ksu/kernel_patches/include/linux/susfs.h" | awk -F'"' '{print $2}')"
            [ -n "$SUSFS_VER" ] || { echo "ERROR: SUSFS_VERSION not found at $pin" >&2; return 1; }
            echo "SUSFS patch file: $SUSFS_PATCH"
            echo "SUSFS_VERSION at ${pin:0:12}: $SUSFS_VER"
          }
          stage_susfs "$SUSFS_TIP" || exit 1
          SUSFS_STAGED="$SUSFS_TIP"
          # If upstream lands a commit between ls-remote and fetch, this build
          # pins the resolved TIP (at most one commit behind) and warns.
          SUSFS_TIP2="$(git ls-remote "$SUSFS_URL" "refs/heads/$SUSFS_BRANCH" | awk '{print $1; exit}' || true)"
          if [ -n "${SUSFS_TIP2:-}" ] && [ "$SUSFS_TIP2" != "$SUSFS_TIP" ]; then echo "WARNING: SUSFS tip moved during fetch ($SUSFS_TIP -> $SUSFS_TIP2); building pinned $SUSFS_TIP" >&2; fi
          # ---- apply: pristine first, symbol-normalized only as a second try
          # Fully floating SUSFS: the git tree carries NO susfs hooks (they were
          # stripped in-tree), so the runner only applies the fresh 50_add
          # FORWARD onto the pristine copy - no reverse step, nothing to drift.
          # The patch's task_mmu.c context follows the base upstream last
          # rebased onto: after "rebase susfs patches onto android15-6.6.143"
          # it expects Google's pgsize_migration rename (vma_data_pages), which
          # our tree already carries; before that it expected vma_pages. So the
          # pristine file is tried FIRST and the symbol is only rewritten when
          # this tip actually wants it - an unconditional sed breaks the hunk
          # at fs/proc/task_mmu.c:1040 on the current tip.
          TASK_MMU="$WORK_DIR/common/fs/proc/task_mmu.c"
          apply_susfs() {
            git -C "$WORK_DIR/common" apply --check "./$SUSFS_PATCH" 2>"$RUNNER_TEMP/susfs-apply.err" \
              && git -C "$WORK_DIR/common" apply "./$SUSFS_PATCH"
          }
          apply_susfs_adaptive() {
            apply_susfs && return 0
            echo "WARNING: $SUSFS_PATCH does not apply to the pristine tree:" >&2
            cat "$RUNNER_TEMP/susfs-apply.err" >&2 || true
            grep -q 'vma_data_pages' "$TASK_MMU" || return 1
            echo "Retrying with the pgsize_migration symbol normalization (vma_data_pages -> vma_pages)..." >&2
            sed -i 's/vma_data_pages/vma_pages/g' "$TASK_MMU"
            if apply_susfs; then return 0; fi
            cat "$RUNNER_TEMP/susfs-apply.err" >&2 || true
            return 1
          }
          # Last known-good pin = the SUSFS pin stamped into BuildInfo by the
          # newest release of THIS branch. Read-only, no extra secrets, and it
          # can only ever offer a pin that already built once.
          last_good_susfs_pin() {
            local tag url pin
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
                     --jq "[.[] | select(.name | contains(\"($GITHUB_REF_NAME)\"))][0].tag_name" 2>/dev/null || true)"
            [ -n "$tag" ] && [ "$tag" != "null" ] || return 1
            url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
                     --jq '[.assets[] | select(.name | startswith("BuildInfo"))][0].url' 2>/dev/null || true)"
            [ -n "$url" ] && [ "$url" != "null" ] || return 1
            pin="$(gh api -H "Accept: application/octet-stream" "$url" 2>/dev/null | awk '/^- SUSFS:/ {print; exit}' | grep -oE '[0-9a-f]{40}' | head -1 || true)"
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s' "$pin"
          }
          SUSFS_PIN_USED="$SUSFS_TIP"
          SUSFS_FALLBACK="false"
          if ! apply_susfs_adaptive; then
            echo "ERROR: SUSFS tip $SUSFS_TIP cannot be applied to this tree" >&2
            git -C "$WORK_DIR/common" checkout -- fs/proc/task_mmu.c 2>/dev/null || true
            LAST_GOOD="$(last_good_susfs_pin || true)"
            if [ -n "${LAST_GOOD:-}" ] && [ "$LAST_GOOD" != "$SUSFS_TIP" ]; then
              echo "WARNING: falling back to the last known-good SUSFS pin $LAST_GOOD (newest release of $GITHUB_REF_NAME)" >&2
              stage_susfs "$LAST_GOOD" || { echo "ERROR: could not stage the fallback pin $LAST_GOOD" >&2; exit 1; }
              apply_susfs_adaptive || { echo "ERROR: fallback pin $LAST_GOOD does not apply either; refusing to ship an unpatched kernel" >&2; exit 1; }
              SUSFS_PIN_USED="$LAST_GOOD"
              SUSFS_FALLBACK="true"
            else
              echo "ERROR: no last known-good SUSFS pin available for $GITHUB_REF_NAME; pass susfs_pin or wait for upstream to fix the tip" >&2
              exit 1
            fi
          fi
          echo "susfs_commit=$SUSFS_PIN_USED" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"
          echo "susfs_fallback=$SUSFS_FALLBACK" >> "$GITHUB_OUTPUT"
          echo "SUSFS pin used: $SUSFS_PIN_USED (staged tip was $SUSFS_STAGED, fallback=$SUSFS_FALLBACK)"
          # Restore our tree's pgsize_migration rename on the two pre-existing
          # call sites only. Guarded to the exact stock context lines so a
          # future floating patch that adds its own `if (vma_pages(vma))` is
          # never rewritten: only lines the stock tree already has.
          sed -i 's/^\tif (vma_pages(vma))$/\tif (vma_data_pages(vma))/; s/^\tif (!vma_pages(vma))$/\tif (!vma_data_pages(vma))/' "$WORK_DIR/common/fs/proc/task_mmu.c"
          # VMA_PAD_START fallback (version-agnostic, no-op when the real
          # header already provides it — same as the reference patches stage).
          if grep -q 'VMA_PAD_START(' "$WORK_DIR/common/fs/proc/task_mmu.c" && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' "$WORK_DIR/common/fs/proc/task_mmu.c"; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' "$WORK_DIR/common/fs/proc/task_mmu.c"
          fi
          # SUSFS kernel configs merged ephemerally on the runner copy;
          # evonix.config itself is NOT touched (keeps tree LOG choice).
          SUSFS_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          for SYM in CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP; do
            sed -i "/^# ${SYM} is not set$/d; /^${SYM}=n$/d" "$SUSFS_CONFIG"
            grep -qx "${SYM}=y" "$SUSFS_CONFIG" || echo "${SYM}=y" >> "$SUSFS_CONFIG"
          done
          grep -q '^CONFIG_KSU_SUSFS=y$' "$SUSFS_CONFIG"
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' "$SUSFS_CONFIG"
          # SUSFS proof in logs: visible verification that the floating patch
          # actually landed (tip, version, files, hooks, configs).
          echo "===== SUSFS APPLIED ====="
          echo "SUSFS tip: $SUSFS_TIP"
          echo "SUSFS_VERSION: $SUSFS_VER"
          echo "----- susfs files (git status) -----"
          git -C "$WORK_DIR/common" status --porcelain | grep -i susfs || true
          echo "----- susfs sources present -----"
          ls "$WORK_DIR/common/fs/susfs.c" "$WORK_DIR/common/include/linux/susfs"*.h || true
          echo "----- susfs hook markers (fs/proc/task_mmu.c) -----"
          grep -c susfs "$WORK_DIR/common/fs/proc/task_mmu.c" || true
          echo "----- CONFIG_KSU_SUSFS in evonix.config -----"
          grep '^CONFIG_KSU_SUSFS' "$SUSFS_CONFIG" || true
          echo "===== END SUSFS APPLIED ====="

      - name: Apply Droidspaces-OSS (optional, dispatch only)
        id: ds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ds }}
        run: |
          set -euo pipefail
          # Optional Droidspaces-OSS support (same source the GKI reference
          # uses when DS is on): SYSVIPC kABI fix for GKI below 6.12 + IPC
          # configs from arch/arm64/configs/evonix-ds.config. Default OFF —
          # push builds never take this path, and evonix.config itself is
          # NOT touched (fragment is applied ephemerally on the runner copy).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          DS_COMMIT="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$DS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve Droidspaces-OSS tip" >&2; exit 1; }
          echo "Droidspaces-OSS tip: $DS_COMMIT"
          echo "ds_commit=$DS_COMMIT" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$RUNNER_TEMP/Droidspaces-OSS" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/Droidspaces-OSS/.git" ] || { echo "ERROR: Droidspaces-OSS clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/Droidspaces-OSS" fetch --depth=1 origin "$DS_COMMIT"
          git -C "$RUNNER_TEMP/Droidspaces-OSS" checkout "$DS_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/Droidspaces-OSS" rev-parse HEAD)" = "$DS_COMMIT" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
          # SYSVIPC kABI fix for android15-6.6 (same patch file the GKI
          # reference applies for this version; dry-run verified on our tree).
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          # Droidspaces kernel configs from the committed fragment
          # arch/arm64/configs/evonix-ds.config (visible/auditable; same 9
          # symbols as the reference Enable Kernel Configs step, USER_NS off).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          DS_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          DS_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-ds.config"
          test -s "$DS_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d; /^${SYM}=n$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d; /^${SYM}=n$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              CONFIG_*'=n')
                SYM="${LINE%'=n'}"
                sed -i "/^# ${SYM} is not set$/d; /^${SYM}=y$/d" "$DS_CONFIG"
                grep -qx "$LINE" "$DS_CONFIG" || echo "$LINE" >> "$DS_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-ds.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$DS_FRAG"

      - name: Apply NoMount (optional, dispatch only)
        id: nm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nomount }}
        run: |
          set -euo pipefail
          # Optional NoMount VFS hooks (same source the GKI reference uses):
          # kernel/setup.sh wires fs/nomount symlink + fs/Makefile + fs/Kconfig,
          # configs from arch/arm64/configs/evonix-nm.config. Default OFF —
          # push builds never take this path, and the git tree stays clean
          # (integration happens on the runner workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          NM_COMMIT="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1; exit}')"
          [[ "$NM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve NoMount tip" >&2; exit 1; }
          echo "NoMount tip: $NM_COMMIT"
          echo "nm_commit=$NM_COMMIT" >> "$GITHUB_OUTPUT"
          NM_SETUP="$RUNNER_TEMP/nomount-setup-$NM_COMMIT.sh"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NM_COMMIT}/kernel/setup.sh" \
            --output "$NM_SETUP"
          test -s "$NM_SETUP"
          chmod 0755 "$NM_SETUP"
          # Pre-clone at the exact SHA: upstream rewinds dev often, so a fresh
          # clone may no longer contain the pinned tree. (Same as reference.)
          if [ ! -d "$WORK_DIR/common/NoMount" ]; then
            git clone --no-checkout https://github.com/maxsteeel/nomount.git "$WORK_DIR/common/NoMount"
          fi
          git -C "$WORK_DIR/common/NoMount" fetch --depth=1 origin "$NM_COMMIT"
          git -C "$WORK_DIR/common/NoMount" checkout --detach --quiet "$NM_COMMIT"
          ( cd "$WORK_DIR/common" && "$NM_SETUP" "$NM_COMMIT" )
          [ "$(git -C "$WORK_DIR/common/NoMount" rev-parse HEAD)" = "$NM_COMMIT" ] || { echo "NoMount pin mismatch" >&2; exit 1; }
          test -L "$WORK_DIR/common/fs/nomount" || { echo "ERROR: fs/nomount symlink missing" >&2; exit 1; }
          # NoMount kernel configs from the committed fragment
          # arch/arm64/configs/evonix-nm.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          NM_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          NM_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-nm.config"
          test -s "$NM_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$NM_CONFIG"
                grep -qx "$LINE" "$NM_CONFIG" || echo "$LINE" >> "$NM_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$NM_CONFIG"
                grep -qx "$LINE" "$NM_CONFIG" || echo "$LINE" >> "$NM_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-nm.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$NM_FRAG"

      - name: Apply NTSync (optional, dispatch only)
        id: ntsync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ntsync }}
        run: |
          set -euo pipefail
          # Optional NTSync driver (same source the kernel_patches reference
          # ships for android15-6.6): base patch adds drivers/misc/ntsync.c +
          # include/uapi/linux/ntsync.h, the android15-6.6 compat patch wires
          # Kconfig (config NTSYNC) + Makefile. Configs come from the
          # committed fragment arch/arm64/configs/evonix-ntsync.config.
          # Default OFF — push builds never take this path, and the git tree
          # stays clean (patches apply on the runner workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          KP_COMMIT="$(git ls-remote https://github.com/WildKernels/kernel_patches.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$KP_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve kernel_patches tip" >&2; exit 1; }
          echo "kernel_patches tip: $KP_COMMIT"
          echo "ntsync_commit=$KP_COMMIT" >> "$GITHUB_OUTPUT"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/WildKernels/kernel_patches/${KP_COMMIT}/common/ntsync/ntsync_base.patch" \
            --output "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/WildKernels/kernel_patches/${KP_COMMIT}/common/ntsync/ntsync_compat_android15-6.6.patch" \
            --output "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          test -s "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          test -s "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/ntsync-base-$KP_COMMIT.patch"
          patch -p1 -d "$WORK_DIR/common" < "$RUNNER_TEMP/ntsync-compat-$KP_COMMIT.patch"
          # Fail-hard guards: driver sources + Kconfig/Makefile wiring.
          test -s "$WORK_DIR/common/drivers/misc/ntsync.c" || { echo "ERROR: drivers/misc/ntsync.c missing after patch" >&2; exit 1; }
          test -s "$WORK_DIR/common/include/uapi/linux/ntsync.h" || { echo "ERROR: include/uapi/linux/ntsync.h missing after patch" >&2; exit 1; }
          grep -q '^config NTSYNC$' "$WORK_DIR/common/drivers/misc/Kconfig" || { echo "ERROR: config NTSYNC missing from drivers/misc/Kconfig" >&2; exit 1; }
          grep -q 'obj-$(CONFIG_NTSYNC)' "$WORK_DIR/common/drivers/misc/Makefile" || { echo "ERROR: NTSYNC obj entry missing from drivers/misc/Makefile" >&2; exit 1; }
          # NTSync kernel configs from the committed fragment
          # arch/arm64/configs/evonix-ntsync.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          NTSYNC_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          NTSYNC_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-ntsync.config"
          test -s "$NTSYNC_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$NTSYNC_CONFIG"
                grep -qx "$LINE" "$NTSYNC_CONFIG" || echo "$LINE" >> "$NTSYNC_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$NTSYNC_CONFIG"
                grep -qx "$LINE" "$NTSYNC_CONFIG" || echo "$LINE" >> "$NTSYNC_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-ntsync.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$NTSYNC_FRAG"

      - name: Apply RTL8821AU USB WiFi (optional, dispatch only)
        id: wifi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_wifi }}
        run: |
          set -euo pipefail
          # Optional RTL8821AU out-of-tree USB WiFi driver
          # (morrownr/8821au-20210708, main branch): monitor mode + frame
          # injection for RTL8811AU/RTL8821AU adapters (e.g. TP-Link
          # 2357:011f, already in the driver's usb_intf.c table).
          # Integration happens on the runner workspace copy only; the git
          # tree stays clean (only the evonix-wifi.config fragment is
          # committed). Modules (=m): the fragment builds the 802.11 stack
          # + driver as loadable modules so onboard WiFi keeps working (the
          # AK3 zip ships only Image while vendor_dlkm stays stock) — the
          # step registers the .kos in modules.bzl and a later gated step
          # copies them into a separate wifi-modules.zip (manual insmod,
          # no autoload, never into vendor_dlkm).
          # (Same resolve-then-verify pattern as the steps above.)
          WIFI_COMMIT="$(git ls-remote https://github.com/morrownr/8821au-20210708.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$WIFI_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve 8821au tip" >&2; exit 1; }
          echo "8821au tip: $WIFI_COMMIT"
          echo "wifi_commit=$WIFI_COMMIT" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do rm -rf "$RUNNER_TEMP/rtl8821au" && git clone --depth=1 https://github.com/morrownr/8821au-20210708.git "$RUNNER_TEMP/rtl8821au" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/rtl8821au/.git" ] || { echo "ERROR: 8821au clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/rtl8821au" fetch --depth=1 origin "$WIFI_COMMIT"
          git -C "$RUNNER_TEMP/rtl8821au" checkout "$WIFI_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/rtl8821au" rev-parse HEAD)" = "$WIFI_COMMIT" ] || { echo "8821au pin mismatch" >&2; exit 1; }
          # Upstream Makefile defaults target USB already (CONFIG_USB_HCI=y,
          # CONFIG_RTL8821A=y, CONFIG_WIFI_MONITOR=y), so no source edits.
          WIFI_DST="$WORK_DIR/common/drivers/net/wireless/rtl8821au"
          rm -rf "$WIFI_DST"
          mkdir -p "$WIFI_DST"
          cp -a "$RUNNER_TEMP/rtl8821au/." "$WIFI_DST/"
          rm -rf "$WIFI_DST/.git"
          # Wire Kconfig + Makefile (in-tree kbuild entry points).
          grep -q 'source "drivers/net/wireless/rtl8821au/Kconfig"' "$WORK_DIR/common/drivers/net/wireless/Kconfig" || \
            sed -i 's|source "drivers/net/wireless/realtek/Kconfig"|source "drivers/net/wireless/realtek/Kconfig"\nsource "drivers/net/wireless/rtl8821au/Kconfig"|' "$WORK_DIR/common/drivers/net/wireless/Kconfig"
          grep -q 'source "drivers/net/wireless/rtl8821au/Kconfig"' "$WORK_DIR/common/drivers/net/wireless/Kconfig" || { echo "ERROR: rtl8821au Kconfig source missing" >&2; exit 1; }
          grep -q 'rtl8821au/' "$WORK_DIR/common/drivers/net/wireless/Makefile" || \
            printf '\nobj-$(CONFIG_RTL8821AU) += rtl8821au/\n' >> "$WORK_DIR/common/drivers/net/wireless/Makefile"
          grep -q 'rtl8821au/' "$WORK_DIR/common/drivers/net/wireless/Makefile" || { echo "ERROR: rtl8821au Makefile entry missing" >&2; exit 1; }
          # cfg80211 path: the upstream Makefile only defines
          # -DCONFIG_IOCTL_CFG80211 inside per-platform ifeq blocks (none of
          # them ARM64-generic). Inject it via USER_EXTRA_CFLAGS so the
          # in-tree build takes the ioctl_cfg80211.o path.
          grep -q 'USER_EXTRA_CFLAGS.*CONFIG_IOCTL_CFG80211' "$WIFI_DST/Makefile" || \
            sed -i '1i USER_EXTRA_CFLAGS += -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT' "$WIFI_DST/Makefile"
          grep -q 'CONFIG_IOCTL_CFG80211' "$WIFI_DST/Makefile" || { echo "ERROR: cfg80211 flag injection missing" >&2; exit 1; }
          # Clang-compat: the kernel builds with -Werror and Clang does not
          # know GCC-only -Wno-enum-int-mismatch / -Wno-stringop-overread
          # (driver Makefile options). -Wno-unknown-warning-option makes
          # Clang ignore unknown -Wno-* instead of erroring.
          grep -q 'Wno-unknown-warning-option' "$WIFI_DST/Makefile" || \
            sed -i '1i ccflags-y += -Wno-unknown-warning-option' "$WIFI_DST/Makefile"
          grep -q 'Wno-unknown-warning-option' "$WIFI_DST/Makefile" || { echo "ERROR: clang-compat flag missing" >&2; exit 1; }
          # Robust include paths: srctree-absolute, in addition to the
          # upstream -I$(src)/... lines. Inserted right after the
          # obj-$(CONFIG_RTL8821AU) line so they stay inside the
          # KERNELRELEASE-gated in-tree branch.
          grep -q 'srctree)/drivers/net/wireless/rtl8821au/include' "$WIFI_DST/Makefile" || \
            sed -i '/^obj-$(CONFIG_RTL8821AU)/a ccflags-y += -I$(srctree)/drivers/net/wireless/rtl8821au/include\nccflags-y += -I$(srctree)/drivers/net/wireless/rtl8821au/platform\nccflags-y += -I$(srctree)/drivers/net/wireless/rtl8821au/hal/btc\nccflags-y += -I$(srctree)/drivers/net/wireless/rtl8821au/hal/phydm\nccflags-y += -I$(srctree)/drivers/net/wireless/rtl8821au/core/crypto' "$WIFI_DST/Makefile"
          grep -q 'srctree)/drivers/net/wireless/rtl8821au/include' "$WIFI_DST/Makefile" || { echo "ERROR: srctree includes missing" >&2; exit 1; }
          test -s "$WIFI_DST/include/drv_types.h" || { echo "ERROR: include/drv_types.h missing from driver copy" >&2; exit 1; }
          # Upstream source fixes (fail-hard, each with its own guard):
          # 1. rtw_recv.h pkt_to_recvframe(): uninitialized buf_star.
          #    Sibling pkt_to_recvmem()/pkt_to_recvdata() call pkt_to_recvframe(pkt)
          #    but ignore its result (each re-derives precv_frame anyway), so
          #    routing the pkt argument to the dead store fixes Clang
          #    -Wuninitialized without touching behavior.
          grep -q 'precv_frame = rxmem_to_recvframe((unsigned char \*)buf_star);' "$WIFI_DST/include/rtw_recv.h" && \
            sed -i 's|precv_frame = rxmem_to_recvframe((unsigned char \*)buf_star);|precv_frame = rxmem_to_recvframe((unsigned char *)pkt->data);|' "$WIFI_DST/include/rtw_recv.h"
          grep -q 'rxmem_to_recvframe((unsigned char \*)pkt->data);' "$WIFI_DST/include/rtw_recv.h" || { echo "ERROR: buf_star fix not applied" >&2; exit 1; }
          # 2. rtw_mlme_ext.h:277 uses non-standard #elseif (GCC accepts,
          #    Clang errors). The intended branch is elif.
          grep -q '^#elseif defined(CONFIG_CUSTOMER_EZVIZ_CHIME2)$' "$WIFI_DST/include/rtw_mlme_ext.h" && \
            sed -i 's|^#elseif defined(CONFIG_CUSTOMER_EZVIZ_CHIME2)$|#elif defined(CONFIG_CUSTOMER_EZVIZ_CHIME2)|' "$WIFI_DST/include/rtw_mlme_ext.h"
          grep -q '^#elif defined(CONFIG_CUSTOMER_EZVIZ_CHIME2)$' "$WIFI_DST/include/rtw_mlme_ext.h" || { echo "ERROR: elseif fix not applied" >&2; exit 1; }
          # 3. rtl8812a_sreset.h:15 uses _RTL88812A_SRESET_H_ as the #ifndef
          #    guard but defines _RTL8812A_SRESET_H_ (typo, GCC never
          #    noticed). Clang -Wheader-guard errors. Align ifndef to the
          #    defined macro.
          grep -q '^#ifndef _RTL88812A_SRESET_H_$' "$WIFI_DST/include/rtl8812a_sreset.h" && \
            sed -i 's|^#ifndef _RTL88812A_SRESET_H_$|#ifndef _RTL8812A_SRESET_H_|' "$WIFI_DST/include/rtl8812a_sreset.h"
          grep -q '^#ifndef _RTL8812A_SRESET_H_$' "$WIFI_DST/include/rtl8812a_sreset.h" || { echo "ERROR: header-guard fix not applied" >&2; exit 1; }
          # 4. rtw_mlme_ext.c Clang -Werror trio (GCC never noticed):
          #  a. BA_starting_seqctrl used uninit when psta==NULL (line ~10349):
          #     init to 0 at declaration (matches sibling BA_* inits).
          grep -q 'u16.BA_starting_seqctrl;$' "$WIFI_DST/core/rtw_mlme_ext.c" && \
            sed -i 's|^\tu16\tBA_starting_seqctrl;$|\tu16\tBA_starting_seqctrl = 0;|' "$WIFI_DST/core/rtw_mlme_ext.c"
          grep -q 'BA_starting_seqctrl = 0;' "$WIFI_DST/core/rtw_mlme_ext.c" || { echo "ERROR: BA_starting_seqctrl init missing" >&2; exit 1; }
          #  b. extraneous parens (line ~12676): single-paren.
          grep -q 'if ((padapter->tdlsinfo.link_established == _TRUE)) {' "$WIFI_DST/core/rtw_mlme_ext.c" && \
            sed -i 's|if ((padapter->tdlsinfo.link_established == _TRUE)) {|if (padapter->tdlsinfo.link_established == _TRUE) {|' "$WIFI_DST/core/rtw_mlme_ext.c"
          grep -q 'if (padapter->tdlsinfo.link_established == _TRUE) {' "$WIFI_DST/core/rtw_mlme_ext.c" || { echo "ERROR: parens fix not applied" >&2; exit 1; }
          #  c. back_ch/back_bw/back_ch_offset maybe-uninit when MCC off
          #     (line ~14899): init to 0 at declaration. NOTE: no ^ anchor —
          #     the declaration line is tab-indented inside a case block.
          grep -q 'u8 back_ch, back_bw, back_ch_offset;$' "$WIFI_DST/core/rtw_mlme_ext.c" && \
            sed -i 's|u8 back_ch, back_bw, back_ch_offset;|u8 back_ch = 0, back_bw = 0, back_ch_offset = 0;|' "$WIFI_DST/core/rtw_mlme_ext.c"
          grep -q 'u8 back_ch = 0, back_bw = 0, back_ch_offset = 0;' "$WIFI_DST/core/rtw_mlme_ext.c" || { echo "ERROR: back_ch init missing" >&2; exit 1; }
          # 5. -Wparentheses-equality sweep (Clang errors, GCC silent):
          #    8 sites of if ((single-comparison)) in the tree; 4b fixed one
          #    (rtw_mlme_ext.c:12676). All 6 files below compile in the USB
          #    build — fix the remaining 7 mechanically, each with its guard.
          grep -qF 'if ((str_ptr[0] != PNO_TLV_FREQ_REPEAT)) {' "$WIFI_DST/os_dep/linux/rtw_android.c" && \
            sed -i 's|if ((str_ptr\[0\] != PNO_TLV_FREQ_REPEAT)) {|if (str_ptr[0] != PNO_TLV_FREQ_REPEAT) {|' "$WIFI_DST/os_dep/linux/rtw_android.c"
          grep -qF 'if (str_ptr[0] != PNO_TLV_FREQ_REPEAT) {' "$WIFI_DST/os_dep/linux/rtw_android.c" || { echo "ERROR: paren fix missing rtw_android.c" >&2; exit 1; }
          grep -qF 'if ((tmp[1] == NULL)) {' "$WIFI_DST/os_dep/linux/ioctl_mp.c" && \
            sed -i 's|if ((tmp\[1\] == NULL)) {|if (tmp[1] == NULL) {|' "$WIFI_DST/os_dep/linux/ioctl_mp.c"
          grep -qF 'if (tmp[1] == NULL) {' "$WIFI_DST/os_dep/linux/ioctl_mp.c" || { echo "ERROR: paren fix missing ioctl_mp.c" >&2; exit 1; }
          grep -qF 'if ((u1Channel == 14)) {' "$WIFI_DST/hal/hal_mp.c" && \
            sed -i 's|if ((u1Channel == 14)) {|if (u1Channel == 14) {|' "$WIFI_DST/hal/hal_mp.c"
          grep -qF 'if (u1Channel == 14) {' "$WIFI_DST/hal/hal_mp.c" || { echo "ERROR: paren fix missing hal_mp.c" >&2; exit 1; }
          grep -qF 'if ((pregpriv->wifi_spec == 1)) {' "$WIFI_DST/hal/hal_dm.c" && \
            sed -i 's|if ((pregpriv->wifi_spec == 1)) {|if (pregpriv->wifi_spec == 1) {|' "$WIFI_DST/hal/hal_dm.c"
          grep -qF 'if (pregpriv->wifi_spec == 1) {' "$WIFI_DST/hal/hal_dm.c" || { echo "ERROR: paren fix missing hal_dm.c" >&2; exit 1; }
          grep -qF 'if ((pHalData->iqk_reg_backup[i].central_chnl != 0)) {' "$WIFI_DST/hal/hal_com.c" && \
            sed -i 's|if ((pHalData->iqk_reg_backup\[i\].central_chnl != 0)) {|if (pHalData->iqk_reg_backup[i].central_chnl != 0) {|' "$WIFI_DST/hal/hal_com.c"
          grep -qF 'if (pHalData->iqk_reg_backup[i].central_chnl != 0) {' "$WIFI_DST/hal/hal_com.c" || { echo "ERROR: paren fix missing hal_com.c" >&2; exit 1; }
          grep -qF 'if ((pattrib->encrypt == _AES_)) {' "$WIFI_DST/core/rtw_security.c" && \
            sed -i 's|if ((pattrib->encrypt == _AES_)) {|if (pattrib->encrypt == _AES_) {|' "$WIFI_DST/core/rtw_security.c"
          grep -qF 'if (pattrib->encrypt == _AES_) {' "$WIFI_DST/core/rtw_security.c" || { echo "ERROR: paren fix missing rtw_security.c#a" >&2; exit 1; }
          grep -qF 'if ((prxattrib->encrypt == _AES_)) {' "$WIFI_DST/core/rtw_security.c" && \
            sed -i 's|if ((prxattrib->encrypt == _AES_)) {|if (prxattrib->encrypt == _AES_) {|' "$WIFI_DST/core/rtw_security.c"
          grep -qF 'if (prxattrib->encrypt == _AES_) {' "$WIFI_DST/core/rtw_security.c" || { echo "ERROR: paren fix missing rtw_security.c#b" >&2; exit 1; }
          # 6. Multiline parens-equality (same Clang error, EOL-open shape):
          #    The ||/&& continuation lives inside an #if that is OFF in our
          #    build, so after preprocessing only if ((X)) + lone ) remains.
          #    Rule: drop the TRAILING ')' of the open line so the if paren
          #    stays open until the lone closer (dropping the 2nd '(' instead
          #    closes the if early and leaves the closer dangling — proven by
          #    a full local kbuild sweep: all 157 driver objects, zero errors).
          #    rtl8812a_phycfg.c:1807 — || inside #if (MP_DRIVER == 1);
          #    MP_DRIVER=0 (CONFIG_MP_INCLUDED=n), guard stripped. The $ anchor
          #    keeps the clean compound ifs at 1418-1424 (which END in '))')
          #    from ever matching.
          grep -qF 'if ((pHalData->bNeedIQK == _TRUE)' "$WIFI_DST/hal/rtl8812a/rtl8812a_phycfg.c" && \
            sed -i 's|if ((pHalData->bNeedIQK == _TRUE)$|if (pHalData->bNeedIQK == _TRUE|' "$WIFI_DST/hal/rtl8812a/rtl8812a_phycfg.c"
          grep -q 'if (pHalData->bNeedIQK == _TRUE$' "$WIFI_DST/hal/rtl8812a/rtl8812a_phycfg.c" && \
            ! grep -qF 'if ((pHalData->bNeedIQK' "$WIFI_DST/hal/rtl8812a/rtl8812a_phycfg.c" || { echo "ERROR: paren fix missing rtl8812a_phycfg.c" >&2; exit 1; }
          #    rtw_beamforming.c:1475 — DEAD CODE, do NOT touch: the whole file
          #    sits inside #ifdef CONFIG_BEAMFORMING which is commented out in
          #    autoconf.h, so the compiler never sees it (verified: no .o is
          #    ever produced). An earlier sweep "fixed" it anyway — reverted.
          #    usb_halinit.c:388 — same EOL-open shape, but the open line ends
          #    with '))' (macro arg paren + if paren): drop the 2nd '(' AND the
          #    line-trailing ')'. Guard CONFIG_USB_INTERRUPT_IN_PIPE is off.
          grep -qF 'if ((IS_FULL_SPEED_USB' "$WIFI_DST/hal/rtl8812a/usb/usb_halinit.c" && \
            sed -i 's|if ((IS_FULL_SPEED_USB(Adapter))$|if (IS_FULL_SPEED_USB(Adapter)|' "$WIFI_DST/hal/rtl8812a/usb/usb_halinit.c"
          grep -q 'if (IS_FULL_SPEED_USB(Adapter)$' "$WIFI_DST/hal/rtl8812a/usb/usb_halinit.c" && \
            ! grep -qF 'if ((IS_FULL_SPEED_USB' "$WIFI_DST/hal/rtl8812a/usb/usb_halinit.c" || { echo "ERROR: paren fix missing usb_halinit.c" >&2; exit 1; }
          # 7. phydm_api.c sometimes-uninit (GCC silent, Clang -Werror):
          #    reg_txagc/reg_mask unset on switch-default and RF-path-else
          #    (phydm_get_txagc_value_for_display, ~line 3127). Init to 0 at
          #    declaration — found by a full local kbuild sweep (all 157
          #    driver objects, zero errors), CI never reached this file.
          grep -q 'u32 reg_txagc;$' "$WIFI_DST/hal/phydm/phydm_api.c" && \
            sed -i 's|^\tu32 reg_txagc;$|\tu32 reg_txagc = 0;|' "$WIFI_DST/hal/phydm/phydm_api.c"
          grep -q 'u32 reg_mask;$' "$WIFI_DST/hal/phydm/phydm_api.c" && \
            sed -i 's|^\tu32 reg_mask;$|\tu32 reg_mask = 0;|' "$WIFI_DST/hal/phydm/phydm_api.c"
          grep -q 'u32 reg_txagc = 0;' "$WIFI_DST/hal/phydm/phydm_api.c" && \
            grep -q 'u32 reg_mask = 0;' "$WIFI_DST/hal/phydm/phydm_api.c" || { echo "ERROR: phydm init missing" >&2; exit 1; }
          # 8. Builtin-link fix: the driver ships its own AES block-cipher
          #    copy (aes_encrypt/aes_decrypt + init/deinit in
          #    core/crypto/aes-internal-enc.c, declared in core/crypto/aes.h)
          #    under the same global names as lib/crypto/aes.c. As an
          #    out-of-tree module this never collided; builtin (=y) links
          #    both into vmlinux and ld.lld dies with 'duplicate symbol:
          #    aes_encrypt'. Rename the driver-local family to
          #    rtw_crypto_aes_* (free in both trees; rtw_aes_* stays
          #    untouched). Word-boundary seds so rtw_aes_encrypt (different
          #    symbol, different signature) never matches.
          for AESF in core/crypto/aes.h core/crypto/aes-internal-enc.c core/crypto/aes-ccm.c core/crypto/aes-ctr.c core/crypto/aes-gcm.c core/crypto/aes-omac1.c; do
            if grep -q '\baes_encrypt\b' "$WIFI_DST/$AESF" || grep -q '\baes_decrypt\b' "$WIFI_DST/$AESF"; then
              sed -i 's/\<aes_encrypt/rtw_crypto_aes_encrypt/g; s/\<aes_decrypt/rtw_crypto_aes_decrypt/g' "$WIFI_DST/$AESF"
            fi
          done
          grep -q 'rtw_crypto_aes_encrypt_init' "$WIFI_DST/core/crypto/aes.h" || { echo "ERROR: aes rename missing aes.h" >&2; exit 1; }
          grep -q 'rtw_crypto_aes_encrypt_init' "$WIFI_DST/core/crypto/aes-internal-enc.c" || { echo "ERROR: aes rename missing aes-internal-enc.c" >&2; exit 1; }
          ! grep -rq '\baes_encrypt\b' "$WIFI_DST/core/crypto/" || { echo "ERROR: bare aes_encrypt remains in driver crypto" >&2; exit 1; }
          ! grep -rq '\baes_decrypt\b' "$WIFI_DST/core/crypto/" || { echo "ERROR: bare aes_decrypt remains in driver crypto" >&2; exit 1; }
          # Fail-hard guards: driver Kconfig + USB device table + monitor flag.
          grep -q '^config RTL8821AU$' "$WIFI_DST/Kconfig" || { echo "ERROR: config RTL8821AU missing from driver Kconfig" >&2; exit 1; }
          grep -q '0x2357, 0x011F' "$WIFI_DST/os_dep/linux/usb_intf.c" || { echo "ERROR: USB ID 2357:011F missing from usb_intf.c" >&2; exit 1; }
          grep -qx 'CONFIG_WIFI_MONITOR = y' "$WIFI_DST/Makefile" || { echo "ERROR: CONFIG_WIFI_MONITOR not y in driver Makefile" >&2; exit 1; }
          # WiFi kernel configs from the committed fragment
          # arch/arm64/configs/evonix-wifi.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          WIFI_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          WIFI_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-wifi.config"
          test -s "$WIFI_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=[ym]$/d" "$WIFI_CONFIG"
                grep -qx "$LINE" "$WIFI_CONFIG" || echo "$LINE" >> "$WIFI_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$WIFI_CONFIG"
                grep -qx "$LINE" "$WIFI_CONFIG" || echo "$LINE" >> "$WIFI_CONFIG"
                ;;
              CONFIG_*'=m')
                SYM="${LINE%'=m'}"
                sed -i "/^# ${SYM} is not set$/d" "$WIFI_CONFIG"
                sed -i "/^${SYM}=y$/d" "$WIFI_CONFIG"
                grep -qx "$LINE" "$WIFI_CONFIG" || echo "$LINE" >> "$WIFI_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-wifi.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$WIFI_FRAG"
          # Module registration: with the stack as =m, kbuild emits 5 .kos
          # (kbuild obj layout: net/wireless/Makefile obj-$(CONFIG_CFG80211),
          # net/mac80211/Makefile obj-$(CONFIG_MAC80211), net/rfkill/Makefile
          # obj-$(CONFIG_RFKILL), lib/crypto/Makefile
          # obj-$(CONFIG_CRYPTO_LIB_ARC4) pulled by MAC80211 selects, plus the
          # driver obj-$(CONFIG_RTL8821AU) := $(MODULE_NAME).o). Register all
          # 5 in modules.bzl on the runner copy (ephemeral like every other
          # wifi wiring; non-WiFi builds keep the stock list) so Kleaf stages
          # them into the dist. Driver .ko name depends on the upstream
          # Makefile default: MODULE_NAME := 8821au when CONFIG_BT_COEXIST=y
          # (default y), else 8811au — resolve with a fail-hard guard.
          if grep -qx 'CONFIG_BT_COEXIST = y' "$WIFI_DST/Makefile"; then
            WIFI_DRV_KO="8821au.ko"
          else
            WIFI_DRV_KO="8811au.ko"
          fi
          grep -q "MODULE_NAME := ${WIFI_DRV_KO%.ko}" "$WIFI_DST/Makefile" || { echo "ERROR: MODULE_NAME mismatch for $WIFI_DRV_KO" >&2; exit 1; }
          echo "Driver module: drivers/net/wireless/rtl8821au/$WIFI_DRV_KO"
          WIFI_MODULES_BZL="$WORK_DIR/common/modules.bzl"
          grep -qx '    "net/vmw_vsock/vmw_vsock_virtio_transport.ko",' "$WIFI_MODULES_BZL" || { echo "ERROR: modules.bzl anchor entry missing" >&2; exit 1; }
          for WIFI_KO in "net/wireless/cfg80211.ko" "net/mac80211/mac80211.ko" "net/rfkill/rfkill.ko" "lib/crypto/libarc4.ko" "drivers/net/wireless/rtl8821au/$WIFI_DRV_KO"; do
            grep -q "\"$WIFI_KO\"" "$WIFI_MODULES_BZL" || \
              sed -i "s|^    \"net/vmw_vsock/vmw_vsock_virtio_transport.ko\",$|    \"net/vmw_vsock/vmw_vsock_virtio_transport.ko\",\n    \"$WIFI_KO\",|" "$WIFI_MODULES_BZL"
            grep -q "\"$WIFI_KO\"" "$WIFI_MODULES_BZL" || { echo "ERROR: $WIFI_KO missing from modules.bzl" >&2; exit 1; }
          done
          echo "modules.bzl wifi registration: 5/5 entries present"
          echo "$WIFI_DRV_KO" > "$RUNNER_TEMP/wifi_drv_ko.txt"
          echo "===== WIFI APPLIED ====="
          echo "8821au pinned SHA: $WIFI_COMMIT"
          echo "Driver dir: drivers/net/wireless/rtl8821au/"
          grep -q 'source "drivers/net/wireless/rtl8821au/Kconfig"' "$WORK_DIR/common/drivers/net/wireless/Kconfig" && echo "Kconfig wiring: OK"
          grep -q 'rtl8821au/' "$WORK_DIR/common/drivers/net/wireless/Makefile" && echo "Makefile wiring: OK"
          echo "----- evonix.config WiFi symbols -----"
          grep -E '^CONFIG_(WLAN|WLAN_VENDOR_REALTEK|CFG80211|MAC80211|RFKILL|RTL8821AU)=' "$WIFI_CONFIG" || true
          echo "===== END WIFI APPLIED ====="

      - name: Apply Baseband-Guard (optional, dispatch only)
        id: bbg
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_bbg }}
        run: |
          set -euo pipefail
          # Optional Baseband-Guard LSM (upstream vc-teahouse/Baseband-guard):
          # kernel-side tree is cloned at a pinned SHA into
          # $WORK_DIR/common/Baseband-guard and wired exactly like the
          # upstream setup.sh cloud-compile path (security/baseband-guard
          # symlink + security/Makefile obj entry + security/Kconfig source
          # entry + CONFIG_LSM defaults extended with baseband_guard).
          # Configs come from the committed fragment
          # arch/arm64/configs/evonix-bbg.config (BBG on, BLOCK_BOOT and
          # BLOCK_RECOVERY OFF so kernels/recovery stay flashable from the
          # running system). Default OFF — push builds never take this path,
          # and the git tree stays clean (integration happens on the runner
          # workspace copy only).
          # (Same resolve-then-verify pattern as KernelSU-Next above.)
          BBG_COMMIT="$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | awk '{print $1; exit}')"
          [[ "$BBG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: could not resolve Baseband-Guard tip" >&2; exit 1; }
          echo "Baseband-Guard tip: $BBG_COMMIT"
          echo "bbg_commit=$BBG_COMMIT" >> "$GITHUB_OUTPUT"
          # Pre-clone at the exact SHA: upstream main moves, so a fresh
          # clone may no longer contain the pinned tree. (Same as NoMount.)
          if [ ! -d "$WORK_DIR/common/Baseband-guard" ]; then
            git clone --no-checkout https://github.com/vc-teahouse/Baseband-guard.git "$WORK_DIR/common/Baseband-guard"
          fi
          git -C "$WORK_DIR/common/Baseband-guard" fetch --depth=1 origin "$BBG_COMMIT"
          git -C "$WORK_DIR/common/Baseband-guard" checkout --detach --quiet "$BBG_COMMIT"
          [ "$(git -C "$WORK_DIR/common/Baseband-guard" rev-parse HEAD)" = "$BBG_COMMIT" ] || { echo "Baseband-Guard pin mismatch" >&2; exit 1; }
          # --- setup.sh wiring, replicated on the pinned tree ---
          SEC_DIR="$WORK_DIR/common/security"
          if command -v realpath >/dev/null 2>&1; then
            BBG_REL="$(realpath --relative-to="$SEC_DIR" "$WORK_DIR/common/Baseband-guard" 2>/dev/null || true)"
          else
            BBG_REL="$WORK_DIR/common/Baseband-guard"
          fi
          [ -n "$BBG_REL" ] || BBG_REL="$WORK_DIR/common/Baseband-guard"
          ln -sfn "$BBG_REL" "$SEC_DIR/baseband-guard"
          test -L "$SEC_DIR/baseband-guard" || { echo "ERROR: security/baseband-guard symlink missing" >&2; exit 1; }
          grep -q 'baseband-guard/' "$SEC_DIR/Makefile" || \
            printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$SEC_DIR/Makefile"
          grep -q 'baseband-guard/' "$SEC_DIR/Makefile" || { echo "ERROR: security/Makefile BBG entry missing" >&2; exit 1; }
          if ! grep -q 'security/baseband-guard/Kconfig' "$SEC_DIR/Kconfig"; then
            awk '
              { a[NR]=$0 } END{
                last=0; for(i=1;i<=NR;i++) if(a[i] ~ /^endmenu[[:space:]]*$/) last=i;
                for(i=1;i<=NR;i++){
                  if(i==last) print "source \"security/baseband-guard/Kconfig\"";
                  print a[i];
                }
              }' "$SEC_DIR/Kconfig" > "$SEC_DIR/Kconfig.tmp" && mv "$SEC_DIR/Kconfig.tmp" "$SEC_DIR/Kconfig"
          fi
          grep -q 'security/baseband-guard/Kconfig' "$SEC_DIR/Kconfig" || { echo "ERROR: security/Kconfig BBG source missing" >&2; exit 1; }
          # CONFIG_LSM defaults: append baseband_guard (same sed as the
          # upstream CI cloud-compile path).
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' "$SEC_DIR/Kconfig"
          grep -q 'baseband_guard' "$SEC_DIR/Kconfig" || { echo "ERROR: CONFIG_LSM defaults lack baseband_guard" >&2; exit 1; }
          # --- rodin allowlist: SAFE SKIP (never fail the build) ---
          # No rodin-specific partition allowlist has been validated, so the
          # upstream-generic allowlist ships as-is. Record the warning for
          # the summary/BuildInfo and continue.
          RODIN_LIST="$WORK_DIR/common/arch/arm64/configs/evonix-bbg-rodin.allowlist"
          if [ -s "$RODIN_LIST" ]; then
            echo "BBG rodin allowlist override present — device-specific list in effect."
            echo "bbg_allowlist=rodin" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BBG uses the upstream-generic partition allowlist; no rodin-specific allowlist validated — modem/efisp/abl behaviour must still be validated on-device (see summary)."
            echo "BBG WARNING: upstream-generic allowlist in effect (no evonix-bbg-rodin.allowlist). On-device validation still required." >> "$GITHUB_STEP_SUMMARY"
            echo "bbg_allowlist=generic" >> "$GITHUB_OUTPUT"
          fi
          # BBG kernel configs from the committed fragment
          # arch/arm64/configs/evonix-bbg.config (visible/auditable).
          # Applied ephemerally on the runner copy; evonix.config untouched.
          BBG_CONFIG="$WORK_DIR/common/arch/arm64/configs/evonix.config"
          BBG_FRAG="$WORK_DIR/common/arch/arm64/configs/evonix-bbg.config"
          test -s "$BBG_FRAG"
          while IFS= read -r LINE || [ -n "$LINE" ]; do
            case "$LINE" in
              ''|'#'*) continue ;;
              '# CONFIG_'*' is not set')
                SYM="${LINE#'# '}"; SYM="${SYM%' is not set'}"
                sed -i "/^${SYM}=y$/d" "$BBG_CONFIG"
                grep -qx "$LINE" "$BBG_CONFIG" || echo "$LINE" >> "$BBG_CONFIG"
                ;;
              CONFIG_*'=y')
                SYM="${LINE%'=y'}"
                sed -i "/^# ${SYM} is not set$/d" "$BBG_CONFIG"
                grep -qx "$LINE" "$BBG_CONFIG" || echo "$LINE" >> "$BBG_CONFIG"
                ;;
              *) echo "ERROR: unexpected line in evonix-bbg.config: $LINE" >&2; exit 1 ;;
            esac
          done < "$BBG_FRAG"

      - name: Restore Bazel cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
        uses: actions/cache@v4
        with:
          # Real Bazel output root: build-evonix.sh locates the generated
          # .config under $WORKSPACE/out/bazel/output_user_root and never
          # passes --output_base, so ~/.cache/bazel is never written.
          path: ${{ env.WORK_DIR }}/out/bazel/output_user_root
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}
          restore-keys: |
            evonix-bazel-${{ github.ref_name }}-

      - name: Set up Clang 23 toolchain
        run: |
          set -euo pipefail
          EVONIX_WORKSPACE="$WORK_DIR" bash "$WORK_DIR/common/setup-clang23.sh"

      - name: Build via build-evonix.sh
        run: |
          set -euo pipefail
          bash "$WORK_DIR/common/build-evonix.sh" "$DIST_DIR"

      - name: Verify Image + vmlinux
        run: |
          set -euo pipefail
          test -s "$DIST_DIR/Image"
          test -s "$DIST_DIR/vmlinux"
          ls -la "$DIST_DIR"
          sha256sum "$DIST_DIR/Image" | tee "$DIST_DIR/Image.sha256"
          # BBR3 self-testimony: every build proves BBR3 was compiled in.
          # Primary: CONFIG_TCP_CONG_BBR3=y in the generated final .config
          # (same locate pattern as build-evonix.sh). Secondary: bbr3 symbol
          # in System.map when the dist carries one.
          BBR3_CFG="$(find "$WORK_DIR/out/bazel/output_user_root" -path '*kernel_aarch64_config/out_dir/.config' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          [ -n "$BBR3_CFG" ] || { echo "ERROR: final kernel .config not found" >&2; exit 1; }
          grep -qx 'CONFIG_TCP_CONG_BBR3=y' "$BBR3_CFG" || { echo "ERROR: CONFIG_TCP_CONG_BBR3=y missing from final .config ($BBR3_CFG)" >&2; exit 1; }
          grep -E '^CONFIG_TCP_CONG_BBR' "$BBR3_CFG" || true
          if [ -f "$DIST_DIR/System.map" ]; then grep -q 'bbr3' "$DIST_DIR/System.map" || { echo "ERROR: no bbr3 symbol in System.map" >&2; exit 1; }; fi
          # WiFi proof hardening: when the dispatch asked for WiFi, assert the
          # evonix-wifi.config symbols landed in the final .config (same
          # BBR3 locate pattern above — reuse $BBR3_CFG). WLAN pair is
          # builtin (=y); the 802.11 stack + driver ship as modules (=m).
          if [ "${{ steps.wifi.outcome }}" = "success" ]; then
            for WIFI_SYM in CONFIG_WLAN CONFIG_WLAN_VENDOR_REALTEK; do
              grep -qx "${WIFI_SYM}=y" "$BBR3_CFG" || { echo "ERROR: ${WIFI_SYM}=y missing from final .config ($BBR3_CFG)" >&2; exit 1; }
            done
            for WIFI_SYM in CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_RFKILL CONFIG_RTL8821AU; do
              grep -qx "${WIFI_SYM}=m" "$BBR3_CFG" || { echo "ERROR: ${WIFI_SYM}=m missing from final .config ($BBR3_CFG)" >&2; exit 1; }
            done
            echo "WiFi final-.config assert: 2/2 =y + 4/4 =m symbols present"
          fi

      - name: Collect WiFi modules (optional, dispatch only)
        id: wifi-modules
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_wifi && steps.wifi.outcome == 'success' }}
        run: |
          set -euo pipefail
          # The wifi step registered 5 .kos in modules.bzl, so Kleaf staged
          # them into DIST_DIR (flat layout, same as the 95/97-ko listing the
          # Verify step prints). Collect them into a separate wifi-modules.zip
          # — NOT into vendor_dlkm (stays stock), NOT into modules.load
          # (no autoload; the user insmods manually in dependency order).
          WIFI_DRV_KO="8821au.ko"
          if [ -f "$RUNNER_TEMP/wifi_drv_ko.txt" ]; then WIFI_DRV_KO="$(cat "$RUNNER_TEMP/wifi_drv_ko.txt")"; fi
          case "$WIFI_DRV_KO" in 8821au.ko|8811au.ko) ;; *) echo "ERROR: unexpected driver ko: $WIFI_DRV_KO" >&2; exit 1 ;; esac
          WIFI_STAGE="$RUNNER_TEMP/wifi-modules"
          rm -rf "$WIFI_STAGE"; mkdir -p "$WIFI_STAGE"
          for KO in cfg80211.ko mac80211.ko rfkill.ko libarc4.ko "$WIFI_DRV_KO"; do
            COUNT="$(find "$DIST_DIR" -name "$KO" -type f | wc -l)"
            [ "$COUNT" -eq 1 ] || { echo "ERROR: expected 1 $KO in DIST_DIR, found $COUNT" >&2; exit 1; }
            find "$DIST_DIR" -name "$KO" -type f -exec cp -a {} "$WIFI_STAGE/" \;
            test -s "$WIFI_STAGE/$KO" || { echo "ERROR: $KO copy failed" >&2; exit 1; }
            echo "staged: $KO"
          done
          ls -la "$WIFI_STAGE"
          ( cd "$WIFI_STAGE" && sha256sum ./*.ko | tee modules.sha256 )
          ( cd "$WIFI_STAGE" && zip -q -9 "$GITHUB_WORKSPACE/wifi-modules.zip" ./*.ko modules.sha256 )
          test -s "$GITHUB_WORKSPACE/wifi-modules.zip"
          unzip -l "$GITHUB_WORKSPACE/wifi-modules.zip"
          echo "===== WIFI MODULES COLLECTED ====="
          echo "driver: $WIFI_DRV_KO (wlan1, NOT wlan0 — onboard owns wlan0)"
          echo "insmod order: rfkill.ko libarc4.ko cfg80211.ko mac80211.ko $WIFI_DRV_KO"
          echo "bring-up: ip link set wlan1 up (IPS/LPS gate RF until up)"
          echo "===== END WIFI MODULES COLLECTED ====="

      - name: Save Bazel cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.use_cache) }}
        uses: actions/cache/save@v4
        with:
          # Same real Bazel output root as Restore (see comment there).
          path: ${{ env.WORK_DIR }}/out/bazel/output_user_root
          key: evonix-bazel-${{ github.ref_name }}-${{ hashFiles('src/Makefile', 'src/BUILD.bazel', 'src/build.config.constants', 'src/arch/arm64/configs/evonix.config') }}

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            coloros/*) VARIANT="COS" ;;
            hyperos/*) VARIANT="HOS" ;;
            *) echo "Unknown branch: ${{ github.ref_name }}" >&2; exit 1 ;;
          esac
          KVER="$(grep -m1 '^SUBLEVEL' src/Makefile | awk '{print $3}')"
          KEXTRA="$(grep -m1 '^EXTRAVERSION' src/Makefile | awk '{print $3}')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP_NAME="EVONIX-${VARIANT}-6.6.${KVER}-${SHORT_SHA}.zip"
          BASE="${ZIP_NAME%.zip}"
          echo "ARTIFACT_NAME=$BASE" >> "$GITHUB_ENV"
          rm -rf AnyKernel3
          AK3_COMMIT="$(git ls-remote https://github.com/osm0sis/AnyKernel3.git refs/heads/master | awk '{print $1; exit}')"
          [ -n "$AK3_COMMIT" ] || { echo "ERROR: could not resolve AnyKernel3 master tip" >&2; exit 1; }
          echo "AK3_COMMIT=$AK3_COMMIT" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3 && break || sleep 5; done
          [ -d AnyKernel3/.git ] || { echo "ERROR: AnyKernel3 clone failed" >&2; exit 1; }
          git -C AnyKernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C AnyKernel3 checkout "$AK3_COMMIT"
          [ "$(git -C AnyKernel3 rev-parse HEAD)" = "$AK3_COMMIT" ] || { echo "AnyKernel3 pin mismatch" >&2; exit 1; }
          rm -rf AnyKernel3/.git
          # AArch64 tools: master ships 32-bit ARM tools that OrangeFox on
          # rodin cannot exec (Exec format error in setup_bb). Replace with
          # OSM-native 64-bit tools from the arm64-tools branch (same author).
          AK3_TOOLS_COMMIT="$(git ls-remote https://github.com/osm0sis/AnyKernel3.git refs/heads/arm64-tools | awk '{print $1; exit}')"
          [ -n "$AK3_TOOLS_COMMIT" ] || { echo "ERROR: could not resolve AnyKernel3 arm64-tools tip" >&2; exit 1; }
          echo "AK3_TOOLS_COMMIT=$AK3_TOOLS_COMMIT" >> "$GITHUB_ENV"
          echo "AnyKernel3 arm64-tools tip: $AK3_TOOLS_COMMIT"
          for i in 1 2 3 4 5; do rm -rf "$RUNNER_TEMP/ak3-arm64tools" && git clone --depth=1 -b arm64-tools https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/ak3-arm64tools" && break || sleep 5; done
          [ -d "$RUNNER_TEMP/ak3-arm64tools/.git" ] || { echo "ERROR: AnyKernel3 arm64-tools clone failed" >&2; exit 1; }
          git -C "$RUNNER_TEMP/ak3-arm64tools" fetch --depth=1 origin "$AK3_TOOLS_COMMIT"
          git -C "$RUNNER_TEMP/ak3-arm64tools" checkout "$AK3_TOOLS_COMMIT"
          [ "$(git -C "$RUNNER_TEMP/ak3-arm64tools" rev-parse HEAD)" = "$AK3_TOOLS_COMMIT" ] || { echo "AnyKernel3 arm64-tools pin mismatch" >&2; exit 1; }
          for T in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            test -s "$RUNNER_TEMP/ak3-arm64tools/$T" || { echo "ERROR: arm64-tools missing: $T" >&2; exit 1; }
            cp -a "$RUNNER_TEMP/ak3-arm64tools/$T" AnyKernel3/tools/$T
          done
          chmod 755 AnyKernel3/tools/busybox AnyKernel3/tools/fec AnyKernel3/tools/httools_static AnyKernel3/tools/lptools_static AnyKernel3/tools/magiskboot AnyKernel3/tools/magiskpolicy AnyKernel3/tools/snapshotupdater_static
          rm -rf "$RUNNER_TEMP/ak3-arm64tools"
          # Fail-hard: tools must be AArch64 (e_machine 0xB7), else recovery
          # dies in setup_bb with Exec format error.
          for BIN in busybox fec httools_static lptools_static magiskboot magiskpolicy snapshotupdater_static; do
            MACH="$(od -A n -t x1 -j 18 -N 2 "AnyKernel3/tools/$BIN" | tr -d ' \n')"
            [ "$MACH" = "b700" ] || { echo "ERROR: AnyKernel3/tools/$BIN not AArch64 (e_machine=$MACH)" >&2; exit 1; }
          done
          # Raw uncompressed Image only (GKI/AK3 convention: ak3-core +
          # magiskboot handle compression at repack; Image.lz4 would be wrong).
          cp -a "$DIST_DIR/Image" AnyKernel3/Image
          test -s AnyKernel3/Image
          # EVONIX branding + OSM port. The osm0sis master template is a
          # tuna-era sample (devicecheck on, omap BLOCK, slot detection off,
          # dump_boot plus tuna ramdisk edits), so normalize it here to the
          # EVONIX GKI layout: device check OFF via manual override below
          # (not an upstream default) so the zip also flashes on custom ROMs
          # where ro.product.device differs from stock rodin; BLOCK boot with
          # auto slot handling, stock ramdisk flow, vbmeta auto, no modules.
          # Pre-checks below fail hard if the upstream template drifts.
          sed -i 's|^kernel.string=.*|kernel.string=EVONIX '"${VARIANT}"' 6.6.'"${KVER}"' by Tomkun-desu @ '"${SHORT_SHA}"'|' AnyKernel3/anykernel.sh
          # --- OSM port: normalize the tuna template to the EVONIX GKI layout.
          # Pre-checks below fail the step under set -e if upstream drifts. ---
          grep -qx 'do.devicecheck=1' AnyKernel3/anykernel.sh
          grep -qx 'do.systemless=1' AnyKernel3/anykernel.sh
          grep -qx 'device.name1=maguro' AnyKernel3/anykernel.sh
          grep -qx 'device.name2=toro' AnyKernel3/anykernel.sh
          grep -qx 'device.name3=toroplus' AnyKernel3/anykernel.sh
          grep -qx 'device.name4=tuna' AnyKernel3/anykernel.sh
          grep -qx 'device.name5=' AnyKernel3/anykernel.sh
          grep -qx 'BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;' AnyKernel3/anykernel.sh
          grep -qx 'IS_SLOT_DEVICE=0;' AnyKernel3/anykernel.sh
          grep -qx 'PATCH_VBMETA_FLAG=auto;' AnyKernel3/anykernel.sh
          grep -qx 'dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk' AnyKernel3/anykernel.sh
          grep -qx '# boot install' AnyKernel3/anykernel.sh
          grep -qx '## end boot install' AnyKernel3/anykernel.sh
          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/^do\.systemless=.*/do.systemless=0/' AnyKernel3/anykernel.sh
          sed -i -E 's/^(device\.name[0-9]*)=.*/\1=/' AnyKernel3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' AnyKernel3/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' AnyKernel3/anykernel.sh
          grep -qx 'NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh && { echo "ERROR: unexpected upstream NO_MAGISK_CHECK" >&2; exit 1; }
          sed -i '/^PATCH_VBMETA_FLAG=auto;$/a NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh
          sed -i '/^boot_attributes() {$/,/^} # end attributes$/d' AnyKernel3/anykernel.sh
          printf '%s\n' \
            '# boot install' \
            '' \
            '# GKI kernel version check (KernelSU supports 5.10/5.15/6.1/6.6/6.12)' \
            "kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')" \
            'case $kernel_version in' \
            '    5.10*|5.15*|6.1*|6.6*|6.12*) ksu_supported=true ;;' \
            '    *) ksu_supported=false ;;' \
            'esac' \
            '' \
            "ui_print \" \" \"  -> EVONIX Supported: \$ksu_supported\"" \
            "\$ksu_supported || abort \"  -> Non-GKI device, abort.\"" \
            '' \
            'split_boot' \
            '' \
            "if [ -f \"\$SPLITIMG/ramdisk.cpio\" ]; then" \
            '    unpack_ramdisk' \
            '    write_boot' \
            'else' \
            '    flash_boot' \
            'fi' \
            '## end boot install' \
            > "$RUNNER_TEMP/evonix-gki-section.txt"
          awk -v SECTION="$RUNNER_TEMP/evonix-gki-section.txt" '
            /^# boot install$/ { while ((getline LINE < SECTION) > 0) print LINE; SKIP=1; next }
            SKIP { if (/^## end boot install$/) SKIP=0; next }
            { print }
          ' AnyKernel3/anykernel.sh > AnyKernel3/anykernel.sh.new
          mv AnyKernel3/anykernel.sh.new AnyKernel3/anykernel.sh
          # EVONIX flash-time banner: upstream osm0sis ships no banner file,
          # so create ours here. update-binary prints 'banner' via
          # ui_printfile, then kernel.string, so this file is the
          # flash-time logo (plain ASCII, 38 cols).
          printf '%s\n' \
            '+====================================+' \
            '|                                    |' \
            '|            E V O N I X             |' \
            '|           by Tomkun-desu           |' \
            '|                                    |' \
            '|------------------------------------|' \
            '|  All rights belong to Mr. NEESCHAL |' \
            '+====================================+' \
            > AnyKernel3/banner
          # OSM port guards: fail hard on any drift from the EVONIX GKI layout.
          grep -qx 'do.devicecheck=0' AnyKernel3/anykernel.sh
          grep -qx 'do.systemless=0' AnyKernel3/anykernel.sh
          grep -qx 'do.modules=0' AnyKernel3/anykernel.sh
          grep -qx 'BLOCK=boot;' AnyKernel3/anykernel.sh
          grep -qx 'IS_SLOT_DEVICE=auto;' AnyKernel3/anykernel.sh
          grep -qx 'NO_MAGISK_CHECK=1;' AnyKernel3/anykernel.sh
          grep -qx 'split_boot' AnyKernel3/anykernel.sh
          grep -qF '5.10*|5.15*|6.1*|6.6*|6.12*' AnyKernel3/anykernel.sh
          if grep -q 'init\.tuna\|fstab\.tuna\|maguro\|toro\|tuna\|device\.name[0-9]*=[^[:space:]]' AnyKernel3/anykernel.sh; then echo "ERROR: tuna template remnant in anykernel.sh" >&2; exit 1; fi
          if grep -q '^dump_boot' AnyKernel3/anykernel.sh; then echo "ERROR: dump_boot remnant in anykernel.sh" >&2; exit 1; fi
          if grep -q '^boot_attributes' AnyKernel3/anykernel.sh; then echo "ERROR: boot_attributes remnant in anykernel.sh" >&2; exit 1; fi
          # WiFi in-zip payload (single-file promise): when the Collect step
          # ran (dispatch ON build), stage its 5 .kos + modules.sha256 as
          # AnyKernel3/wifi-modules/ and append a BEST-EFFORT copy block to
          # anykernel.sh. boot.img stays kernel-only (GKI split_boot, vendor
          # ramdisk untouched); do.modules stays 0 (/system is EROFS on
          # rodin), so the block targets /data/local/tmp/evonix-wifi and can
          # never abort the flash (boot is already written when it runs).
          WIFI_BUNDLED=false
          WIFI_DRV_KO="8821au.ko"
          if [ -f "$RUNNER_TEMP/wifi_drv_ko.txt" ]; then WIFI_DRV_KO="$(cat "$RUNNER_TEMP/wifi_drv_ko.txt")"; fi
          case "$WIFI_DRV_KO" in 8821au.ko|8811au.ko) ;; *) echo "ERROR: unexpected driver ko: $WIFI_DRV_KO" >&2; exit 1 ;; esac
          WIFI_BUNDLE_STATUS="absent (WiFi not requested — zip is kernel-only Image)"
          WIFI_BUNDLE_SHORT="absent"
          if [ -s "$GITHUB_WORKSPACE/wifi-modules.zip" ] || [ -d "$RUNNER_TEMP/wifi-modules" ]; then
            WIFI_SRC="$RUNNER_TEMP/wifi-modules"
            if [ ! -d "$WIFI_SRC" ]; then
              WIFI_SRC="$RUNNER_TEMP/wifi-from-zip"
              rm -rf "$WIFI_SRC"; mkdir -p "$WIFI_SRC"
              unzip -q -o "$GITHUB_WORKSPACE/wifi-modules.zip" -d "$WIFI_SRC"
            fi
            grep -qx '## end boot install' AnyKernel3/anykernel.sh
            mkdir -p AnyKernel3/wifi-modules
            for KO in cfg80211.ko mac80211.ko rfkill.ko libarc4.ko "$WIFI_DRV_KO" modules.sha256; do
              test -s "$WIFI_SRC/$KO" || { echo "ERROR: wifi payload missing: $WIFI_SRC/$KO" >&2; exit 1; }
              cp -a "$WIFI_SRC/$KO" AnyKernel3/wifi-modules/
            done
            ( cd AnyKernel3/wifi-modules && sha256sum -c modules.sha256 ) || { echo "ERROR: wifi payload sha256 mismatch" >&2; exit 1; }
            ls -la AnyKernel3/wifi-modules
            cat >> AnyKernel3/anykernel.sh <<'WIFIEOF'
          # EVONIX WiFi modules (bundled payload — best-effort, never aborts:
          # the boot.img above is already flashed when this runs).
          if [ -d "$AKHOME/wifi-modules" ]; then
            ui_print " " "  -> EVONIX WiFi modules found, staging to /data/local/tmp/evonix-wifi";
            if mkdir -p /data/local/tmp/evonix-wifi 2>/dev/null; then
              WIFI_OK=true;
              for KO in rfkill.ko libarc4.ko cfg80211.ko mac80211.ko 8821au.ko 8811au.ko modules.sha256; do
                if [ -f "$AKHOME/wifi-modules/$KO" ]; then
                  cp -af "$AKHOME/wifi-modules/$KO" /data/local/tmp/evonix-wifi/ 2>/dev/null || WIFI_OK=false;
                fi;
              done;
              chmod 644 /data/local/tmp/evonix-wifi/*.ko 2>/dev/null || WIFI_OK=false;
              if [ "$WIFI_OK" = true ]; then
                ui_print "  -> staged: insmod rfkill libarc4 cfg80211 mac80211 8821au/8811au, then: ip link set wlan1 up";
              else
                ui_print "  -> staging incomplete (boot is flashed) — push wifi-modules manually via adb";
              fi;
              unset WIFI_OK KO;
            else
              ui_print "  -> /data not writable (boot is flashed) — push wifi-modules manually via adb";
            fi;
          fi;
          WIFIEOF
            grep -qF 'evonix-wifi' AnyKernel3/anykernel.sh
            grep -qx 'do.modules=0' AnyKernel3/anykernel.sh
            WIFI_BUNDLED=true
            WIFI_BUNDLE_STATUS="bundled (wifi-modules/: 5 .ko + modules.sha256 -> /data/local/tmp/evonix-wifi; insmod rfkill libarc4 cfg80211 mac80211 $WIFI_DRV_KO; wlan1, ip link set wlan1 up)"
            WIFI_BUNDLE_SHORT="bundled"
            echo "===== WIFI MODULES BUNDLED INTO AK3 ZIP ====="
            echo "driver: $WIFI_DRV_KO (wlan1, NOT wlan0 — onboard owns wlan0)"
            echo "payload: AnyKernel3/wifi-modules/ (5 .ko + modules.sha256)"
            echo "copy destination: /data/local/tmp/evonix-wifi (best-effort, never aborts)"
            echo "insmod order: rfkill.ko libarc4.ko cfg80211.ko mac80211.ko $WIFI_DRV_KO"
            echo "bring-up: ip link set wlan1 up (IPS/LPS gate RF until up)"
            echo "===== END WIFI MODULES BUNDLED ====="
          else
            echo "WiFi not requested — AK3 zip unchanged (kernel-only Image, no wifi-modules/)"
          fi
          # Direct-flashable staging: the artifact itself IS the flashable tree.
          # upload-artifact re-zips `path`, so STAGE holds the AK3 layout at
          # top level (META-INF/anykernel.sh/Image/banner) plus the BuildInfo
          # manifest + Image.sha256. No inner versioned zip — the downloaded
          # <ARTIFACT_NAME>.zip flashes directly with no extraction step.
          # AK3 layout guards on the source dir.
          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/Image
          test -d AnyKernel3/META-INF
          test -f AnyKernel3/banner
          IMG_SIZE="$(stat -c%s AnyKernel3/Image)"
          IMG_SHA="$(sha256sum AnyKernel3/Image | cut -d' ' -f1)"
          KSU_PIN="${{ steps.ksu-latest.outputs.ksu_sha }}"
          # KSU always runs (no `if:` on ksu-latest): an empty pin means the
          # step failed to publish ksu_sha — fail hard, never ship unknown KSU.
          # (DS/NM are optional/conditional: empty there is valid, handled below.)
          [ -n "$KSU_PIN" ] || { echo "ERROR: KSU_PIN is empty (ksu_sha missing)" >&2; exit 1; }
          DS_PIN="${{ steps.ds.outputs.ds_commit }}"
          NM_PIN="${{ steps.nm.outputs.nm_commit }}"
          NTSYNC_PIN="${{ steps.ntsync.outputs.ntsync_commit }}"
          WIFI_PIN="${{ steps.wifi.outputs.wifi_commit }}"
          BBG_PIN="${{ steps.bbg.outputs.bbg_commit }}"
          SUSFS_PIN="${{ steps.susfs.outputs.susfs_commit }}"
          # SUSFS always runs (no `if:` on susfs): an empty pin means the
          # step failed to publish susfs_commit — fail hard, never ship
          # unknown SUSFS.
          [ -n "$SUSFS_PIN" ] || { echo "ERROR: SUSFS_PIN is empty (susfs_commit missing)" >&2; exit 1; }
          SUSFS_VER="${{ steps.susfs.outputs.susfs_ver }}"
          [ -n "$SUSFS_VER" ] || { echo "ERROR: SUSFS_VER is empty (susfs_ver missing)" >&2; exit 1; }
          SUSFS_FALLBACK="${{ steps.susfs.outputs.susfs_fallback }}"
          if [ "$SUSFS_FALLBACK" = "true" ]; then
            SUSFS_NOTE="$SUSFS_VER ($SUSFS_PIN, last known-good fallback: the gki-android15-6.6 tip did not apply)"
          else
            SUSFS_NOTE="$SUSFS_VER ($SUSFS_PIN, floating gki-android15-6.6 tip @ simonpunk/susfs4ksu)"
          fi
          DS_STATUS="disabled"; [ -n "$DS_PIN" ] || DS_PIN="n/a"
          if [ "${DS_PIN}" != "n/a" ]; then DS_STATUS="enabled ($DS_PIN)"; fi
          NM_STATUS="disabled"; [ -n "$NM_PIN" ] || NM_PIN="n/a"
          if [ "${NM_PIN}" != "n/a" ]; then NM_STATUS="enabled ($NM_PIN)"; fi
          NTSYNC_STATUS="disabled"; [ -n "$NTSYNC_PIN" ] || NTSYNC_PIN="n/a"
          if [ "${NTSYNC_PIN}" != "n/a" ]; then NTSYNC_STATUS="enabled ($NTSYNC_PIN)"; fi
          WIFI_STATUS="disabled"; [ -n "$WIFI_PIN" ] || WIFI_PIN="n/a"
          if [ "${WIFI_PIN}" != "n/a" ]; then WIFI_STATUS="enabled ($WIFI_PIN)"; fi
          BBG_STATUS="disabled"; [ -n "$BBG_PIN" ] || BBG_PIN="n/a"
          if [ "${BBG_PIN}" != "n/a" ]; then
            BBG_ALLOW="${{ steps.bbg.outputs.bbg_allowlist }}"; BBG_ALLOW="${BBG_ALLOW:-generic}"
            BBG_STATUS="enabled ($BBG_PIN, allowlist: $BBG_ALLOW)"
          fi
          # SUSFS_VER comes from the susfs step output (fail-hard above);
          # never re-read it from the tree (susfs.h is not in-tree).
          KSTRING="$(grep -m1 '^kernel.string=' AnyKernel3/anykernel.sh | cut -d= -f2-)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # inputs.* is empty on push — default gracefully.
          IN_REL="${{ inputs.release_type }}"; IN_REL="${IN_REL:-Action (push)}"
          IN_CACHE="${{ inputs.use_cache }}"; IN_CACHE="${IN_CACHE:-true}"
          IN_DS="${{ inputs.use_ds }}"; IN_DS="${IN_DS:-false}"
          IN_NM="${{ inputs.use_nomount }}"; IN_NM="${IN_NM:-false}"
          IN_NTSYNC="${{ inputs.use_ntsync }}"; IN_NTSYNC="${IN_NTSYNC:-false}"
          IN_WIFI="${{ inputs.use_wifi }}"; IN_WIFI="${IN_WIFI:-false}"
          IN_BBG="${{ inputs.use_bbg }}"; IN_BBG="${IN_BBG:-false}"
          WIFI_OUTCOME="${{ steps.wifi.outcome }}"; WIFI_OUTCOME="${WIFI_OUTCOME:-skipped}"
          STAGE="evonix-artifact"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -a AnyKernel3/. "$STAGE/"
          ( cd "$STAGE" && sha256sum Image > Image.sha256 )
          cat > "$STAGE/BuildInfo-$BASE.md" <<EOF
          # EVONIX BuildInfo — $BASE
          - Branch: ${{ github.ref_name }}
          - Commit: $GITHUB_SHA (short: $SHORT_SHA)
          - Kernel: 6.6.$KVER ($KEXTRA)
          - KernelSU-Next: $KSU_PIN (dev-susfs @ pershoot/KernelSU-Next)
          - SUSFS: $SUSFS_NOTE
          - Droidspaces: $DS_STATUS
          - NoMount: $NM_STATUS
          - NTSync: $NTSYNC_STATUS
          - RTL8821AU WiFi: $WIFI_STATUS
          - WiFi bundle: $WIFI_BUNDLE_STATUS
          - Baseband-Guard: $BBG_STATUS
          - AnyKernel3: $AK3_COMMIT (master @ osm0sis/AnyKernel3)
          - AnyKernel3 tools: $AK3_TOOLS_COMMIT (arm64-tools @ osm0sis/AnyKernel3, AArch64)
          - Toolchain: Clang 23.0.1 (android build 16311247, r614150) + ThinLTO + AutoFDO
          - Build date: $BUILD_DATE
          - Inputs: release_type=$IN_REL, use_cache=$IN_CACHE, use_ds=$IN_DS, use_nomount=$IN_NM, use_ntsync=$IN_NTSYNC, use_wifi=$IN_WIFI, use_bbg=$IN_BBG
          - SUSFS pin source: $([ "$SUSFS_FALLBACK" = "true" ] && echo "last known-good fallback" || echo "floating gki-android15-6.6 tip")
          - WiFi proof: IN_WIFI=$IN_WIFI, steps.wifi.outcome=$WIFI_OUTCOME, wifi_commit=${WIFI_PIN:-n/a}
          - kernel.string: $KSTRING
          - Image: $IMG_SIZE bytes, sha256 $IMG_SHA
          - Artifact: $BASE.zip (direct-flashable — AK3 top level + this BuildInfo, no inner zip)
          EOF
          # Throwaway re-zip proves the staged tree zips cleanly; log entries.
          rm -f "_verify_$BASE.zip"
          ( cd "$STAGE" && zip -r -q -9 "../_verify_$BASE.zip" . )
          ZIP_LIST="$(unzip -l "_verify_$BASE.zip")"
          echo "$ZIP_LIST"
          for ENTRY in 'META-INF/' 'anykernel.sh' 'Image' 'banner' "BuildInfo-$BASE.md" 'Image.sha256'; do
            grep -q "$ENTRY" <<<"$ZIP_LIST" || { echo "ERROR: staged artifact missing entry: $ENTRY" >&2; exit 1; }
          done
          if [ "$WIFI_BUNDLED" = true ]; then
            for WENTRY in 'wifi-modules/' 'wifi-modules/8821au.ko' 'wifi-modules/8811au.ko' 'wifi-modules/cfg80211.ko' 'wifi-modules/mac80211.ko' 'wifi-modules/rfkill.ko' 'wifi-modules/libarc4.ko' 'wifi-modules/modules.sha256'; do
              case "$WENTRY" in
                "wifi-modules/$WIFI_DRV_KO") ;;
                'wifi-modules/8821au.ko'|'wifi-modules/8811au.ko') continue ;;
              esac
              grep -q "$WENTRY" <<<"$ZIP_LIST" || { echo "ERROR: staged artifact missing wifi entry: $WENTRY" >&2; exit 1; }
            done
          else
            if grep -q 'wifi-modules/' <<<"$ZIP_LIST"; then echo "ERROR: unexpected wifi-modules/ in OFF/push build" >&2; exit 1; fi
          fi
          rm -f "_verify_$BASE.zip"
          # English-only build summary: config matrix → artifact result.
          {
            echo "## EVONIX Build — $BASE"
            echo ""
            echo "Event: ${{ github.event_name }} | Branch: ${{ github.ref_name }}"
            echo ""
            echo "| inputs (use_ds/use_nomount/use_ntsync/use_wifi/use_bbg/use_cache/release_type) | Result |"
            echo "|---|---|"
            echo "| $IN_DS / $IN_NM / $IN_NTSYNC / $IN_WIFI / $IN_BBG / $IN_CACHE / $IN_REL | 🗜️ $BASE.zip — direct-flashable, Image $IMG_SIZE bytes, sha256 \`${IMG_SHA:0:16}…\` |"
            echo ""
            echo "| Pin | Value |"
            echo "|---|---|"
            echo "| KSU-Next | \`${KSU_PIN:-n/a}\` |"
            echo "| SUSFS | \`$SUSFS_VER ($SUSFS_PIN)\` |"
            echo "| Droidspaces | \`$DS_STATUS\` |"
            echo "| NoMount | \`$NM_STATUS\` |"
            echo "| NTSync | \`$NTSYNC_STATUS\` |"
            echo "| RTL8821AU WiFi | \`$WIFI_STATUS / bundle: $WIFI_BUNDLE_SHORT\` |"
            echo "| Baseband-Guard | \`$BBG_STATUS\` |"
            echo "| AnyKernel3 | \`${AK3_COMMIT:-n/a}\` |"
            if [ "$IN_BBG" = "true" ]; then
              echo ""
            echo "> ⚠️ BBG built with the upstream-generic allowlist (no validated rodin list) — on-device validation for modem/efisp/abl/modemst/fsg/fsc partitions is still required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EVONIX artifact (zip + sha256 + BuildInfo)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/evonix-artifact/
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Release' || inputs.release_type == 'Pre-Release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (build metadata)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download EVONIX artifact (zip + sha256 + BuildInfo)
        uses: actions/download-artifact@v4
        with:
          pattern: EVONIX-*
          path: evonix-artifact
          merge-multiple: true

      - name: Create GitHub release (auto tag evonix-vN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          # KSU SHA comes from the build job output (submodule is unpinned at
          # build time); fallback to live tip resolve if the output is empty.
          KSU_PIN="${{ needs.build.outputs.ksu_sha }}"
          [ -n "$KSU_PIN" ] || KSU_PIN="$(git ls-remote https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs | awk '{print $1; exit}')"
          DS_PIN="${{ needs.build.outputs.ds_commit }}"
          DS_STATUS="disabled"
          if [ "${{ inputs.use_ds }}" = "true" ]; then
            [ -n "$DS_PIN" ] || DS_PIN="$(git ls-remote https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main | awk '{print $1; exit}')"
            DS_STATUS="enabled ($DS_PIN)"
          fi
          NM_PIN="${{ needs.build.outputs.nm_commit }}"
          NM_STATUS="disabled"
          if [ "${{ inputs.use_nomount }}" = "true" ]; then
            [ -n "$NM_PIN" ] || NM_PIN="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1; exit}')"
            NM_STATUS="enabled ($NM_PIN)"
          fi
          NTSYNC_PIN="${{ needs.build.outputs.ntsync_commit }}"
          NTSYNC_STATUS="disabled"
          if [ "${{ inputs.use_ntsync }}" = "true" ]; then
            [ -n "$NTSYNC_PIN" ] || NTSYNC_PIN="$(git ls-remote https://github.com/WildKernels/kernel_patches.git refs/heads/main | awk '{print $1; exit}')"
            NTSYNC_STATUS="enabled ($NTSYNC_PIN)"
          fi
          WIFI_PIN="${{ needs.build.outputs.wifi_commit }}"
          WIFI_STATUS="disabled"
          if [ "${{ inputs.use_wifi }}" = "true" ]; then
            [ -n "$WIFI_PIN" ] || WIFI_PIN="$(git ls-remote https://github.com/morrownr/8821au-20210708.git refs/heads/main | awk '{print $1; exit}')"
            WIFI_STATUS="enabled ($WIFI_PIN)"
          fi
          BBG_PIN="${{ needs.build.outputs.bbg_commit }}"
          BBG_STATUS="disabled"
          if [ "${{ inputs.use_bbg }}" = "true" ]; then
            [ -n "$BBG_PIN" ] || BBG_PIN="$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | awk '{print $1; exit}')"
            BBG_ALLOW="${{ needs.build.outputs.bbg_allowlist }}"; BBG_ALLOW="${BBG_ALLOW:-generic}"
            BBG_STATUS="enabled ($BBG_PIN, allowlist: $BBG_ALLOW)"
          fi
          # SUSFS pin/ver come from the build job outputs (floating tip,
          # resolved at build time); fallback to live tip resolve.
          SUSFS_PIN="${{ needs.build.outputs.susfs_commit }}"
          [ -n "$SUSFS_PIN" ] || for i in 1 2 3 4 5; do SUSFS_PIN="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android15-6.6 | awk '{print $1; exit}' || true)"; [[ "$SUSFS_PIN" =~ ^[0-9a-f]{40}$ ]] && break || { SUSFS_PIN=""; sleep 15; }; done
          SUSFS_VER="${{ needs.build.outputs.susfs_ver }}"
          [ -n "$SUSFS_VER" ] || SUSFS_VER="unknown"
          SUSFS_FALLBACK="${{ needs.build.outputs.susfs_fallback }}"
          if [ "$SUSFS_FALLBACK" = "true" ]; then
            SUSFS_NOTE="$SUSFS_VER ($SUSFS_PIN, last known-good fallback: the gki-android15-6.6 tip did not apply)"
          else
            SUSFS_NOTE="$SUSFS_VER ($SUSFS_PIN, floating gki-android15-6.6 tip @ simonpunk/susfs4ksu)"
          fi
          KEXTRA="$(grep -m1 '^EXTRAVERSION' Makefile | awk '{print $3}')"
          mapfile -t TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^evonix-v[0-9]+$' || true)
          MAX=0
          for T in ${TAGS[@]:-}; do
            N="${T#evonix-v}"
            if [[ "$N" =~ ^[0-9]+$ && "$N" -gt "$MAX" ]]; then MAX="$N"; fi
          done
          TAG="evonix-v$((MAX + 1))"
          echo "Tag: $TAG (branch $BRANCH @ ${COMMIT:0:12})"
          cat > "BuildInfo-$TAG.md" <<EOF
          # EVONIX $TAG
          - Branch: $BRANCH
          - Commit: $COMMIT
          - Kernel: 6.6.x ($KEXTRA)
          - KernelSU-Next: $KSU_PIN (latest dev-susfs @ pershoot/KernelSU-Next)
          - SUSFS: $SUSFS_NOTE
          - Droidspaces: $DS_STATUS
          - NoMount: $NM_STATUS
          - NTSync: $NTSYNC_STATUS
          - RTL8821AU WiFi: $WIFI_STATUS
          - Baseband-Guard: $BBG_STATUS
          - Toolchain: Clang 23.0.1 (android build 16311247, r614150) + ThinLTO + AutoFDO
          - Device: Poco X7 Pro (rodin)
          EOF
          CREATE_ARGS=(--title "EVONIX $TAG ($BRANCH)" --notes-file "BuildInfo-$TAG.md")
          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then CREATE_ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "BuildInfo-$TAG.md"
          else
            gh release create "$TAG" "${CREATE_ARGS[@]}"
          fi
          # The artifact payload is the raw AK3 tree (direct-flashable, no
          # inner zip). Re-zip it here into the versioned release zip.
          ls -la evonix-artifact/
          INFOS=(evonix-artifact/BuildInfo-*.md)
          [ "${#INFOS[@]}" -eq 1 ] || { echo "ERROR: expected 1 BuildInfo in artifact, found ${#INFOS[@]}" >&2; exit 1; }
          BASE="$(basename "${INFOS[0]}" .md)"; BASE="${BASE#BuildInfo-}"
          ZIP_NAME="$BASE.zip"
          test -f evonix-artifact/anykernel.sh
          test -f evonix-artifact/Image
          test -d evonix-artifact/META-INF
          rm -f "$ZIP_NAME" "$ZIP_NAME.sha256"
          ( cd evonix-artifact && zip -r -q -9 "../$ZIP_NAME" . )
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"
          unzip -l "$ZIP_NAME"
          # Release ships the versioned flashable zip + its sha256 + both
          # BuildInfo manifests (tag notes + in-artifact manifest).
          FILES=(BuildInfo-"$TAG".md "$ZIP_NAME" "$ZIP_NAME.sha256" "${INFOS[0]}")
          FAILED=0
          for F in "${FILES[@]}"; do
            OK=false
            for ATTEMPT in 1 2 3; do
              if gh release upload "$TAG" "$F" --clobber; then OK=true; break; fi
              echo "Attempt $ATTEMPT/3 failed for: $F" >&2
              sleep 10
            done
            [ "$OK" = true ] || FAILED=1
          done
          exit "$FAILED"
